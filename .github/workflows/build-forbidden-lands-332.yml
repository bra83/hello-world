name: Forbidden Lands 3.3.2 build worker
# fixed-public-npm-lock: 2026-09-20
# absolute-worker-paths: 2026-09-20
# emulator-shell-fix: 2026-09-20

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-332.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: "660a1103c3e929024601b8e61dc9bb58011a7a19829e68440fcd3b48e4b9f9e6"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.2_TTS_IMAGE_PROMPT_ANDROID_STUDIO_FIXED_LOCK.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "czzyxxPiC5kr"
  FILE_ID: "01a0bd7c3796770bb84be4f94aaaab44"
  RELEASE_TAG: "forbidden-lands-3.3.2-worker"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download exact Forbidden Lands source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work

          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.2 source not found in share')
          PY

          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"

          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 300             "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"

          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" > SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$SOURCE_NAME" -d work
          cp "incoming/$SOURCE_NAME" FORBIDDEN_LANDS_3.3.2_SOURCE.zip
          sha256sum FORBIDDEN_LANDS_3.3.2_SOURCE.zip > FORBIDDEN_LANDS_3.3.2_SOURCE.zip.sha256

      - name: Locate Android project automatically
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/gradlew" ]               && [ -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ]               && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              ANDROID_ROOT="$candidate"
              break
            fi
          done < <(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)

          test -n "$ANDROID_ROOT"
          chmod +x "$ANDROID_ROOT/gradlew"

          WEB_ROOT="$(dirname "$ANDROID_ROOT")"
          test -f "$WEB_ROOT/package.json"

          ANDROID_ROOT_ABS="$GITHUB_WORKSPACE/$ANDROID_ROOT"
          WEB_ROOT_ABS="$GITHUB_WORKSPACE/$WEB_ROOT"
          echo "android_root=$ANDROID_ROOT_ABS" >> "$GITHUB_OUTPUT"
          echo "web_root=$WEB_ROOT_ABS" >> "$GITHUB_OUTPUT"
          echo "ANDROID_ROOT=$ANDROID_ROOT_ABS"
          echo "WEB_ROOT=$WEB_ROOT_ABS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies and set version
        shell: bash
        env:
          WEB_ROOT: ${{ steps.src.outputs.web_root }}
          ANDROID_ROOT: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          cd "$WEB_ROOT"
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund

          python3 - <<'PY'
          from pathlib import Path
          import json, re, os

          web=Path(os.environ['WEB_ROOT'])
          android=Path(os.environ['ANDROID_ROOT'])

          pkg=web/'package.json'
          data=json.loads(pkg.read_text(encoding='utf-8-sig'))
          data['version']='3.3.2'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          gradle=android/'app/build.gradle'
          text=gradle.read_text(encoding='utf-8-sig')
          text=re.sub(r'versionCode\s+\d+', 'versionCode 303002', text, count=1)
          text=re.sub(r'versionName\s+"[^"]+"', 'versionName "3.3.2"', text, count=1)
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Forbidden Lands runtime gates and Android sync
        shell: bash
        env:
          WEB_ROOT: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          cd "$WEB_ROOT"
          npm run verify:start-freeze
          npm run verify:rules
          npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper and project discovery
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew --version --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_VERSION.txt"
          ./gradlew projects --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_PROJECTS.txt"

      - name: Gradle manifest and resources
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --stacktrace --no-daemon             | tee "$GITHUB_WORKSPACE/GRADLE_RESOURCES.txt"

      - name: Gradle Kotlin and Java compile
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace --no-daemon             | tee "$GITHUB_WORKSPACE/GRADLE_COMPILE.txt"

      - name: Assemble APK
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon             | tee "$GITHUB_WORKSPACE/GRADLE_ASSEMBLE.txt"

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt

          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303002'" APK_BADGING.txt
          grep -q "versionName='3.3.2'" APK_BADGING.txt
          grep -q "sdkVersion:'24'" APK_BADGING.txt
          grep -q "targetSdkVersion:'36'" APK_BADGING.txt

          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator S23-Ultra-like smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1440x3088
            adb shell wm density 560
            adb install -r "$APK_NAME"
            adb shell am force-stop com.braseiro.forbiddenlands
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 15
            adb shell pidof com.braseiro.forbiddenlands

            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.2_ANDROID_S23_PROFILE.png
            test -s FORBIDDEN_LANDS_3.3.2_ANDROID_S23_PROFILE.png

            adb logcat -d -t 800 > FORBIDDEN_LANDS_3.3.2_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.2_LOGCAT.txt

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.2
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk.sha256
            APK_ZIP_TEST.txt
            APK_BADGING.txt
            APK_SIGNATURE.txt
            GRADLE_VERSION.txt
            GRADLE_PROJECTS.txt
            GRADLE_RESOURCES.txt
            GRADLE_COMPILE.txt
            GRADLE_ASSEMBLE.txt
            FORBIDDEN_LANDS_3.3.2_ANDROID_S23_PROFILE.png
            FORBIDDEN_LANDS_3.3.2_LOGCAT.txt
            FORBIDDEN_LANDS_3.3.2_SOURCE.zip
            FORBIDDEN_LANDS_3.3.2_SOURCE.zip.sha256
            SOURCE_ZIP_INTEGRITY.txt

      - name: Publish worker release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG"             --target "$GITHUB_SHA"             --title "Forbidden Lands 3.3.2 — verified build worker"             --notes "Verified Android build worker. Gradle wrapper, project discovery, resources, Kotlin/Java compile, assembleDebug, APK zip/badging/signature/SHA and Android emulator launch are gated. Emulator uses 1440x3088@560dpi S23-Ultra-like profile; it is not a physical S23 Ultra."

          gh release upload "$RELEASE_TAG"             "$APK_NAME" "$APK_NAME.sha256"             APK_ZIP_TEST.txt APK_BADGING.txt APK_SIGNATURE.txt             GRADLE_VERSION.txt GRADLE_PROJECTS.txt GRADLE_RESOURCES.txt GRADLE_COMPILE.txt GRADLE_ASSEMBLE.txt             FORBIDDEN_LANDS_3.3.2_ANDROID_S23_PROFILE.png FORBIDDEN_LANDS_3.3.2_LOGCAT.txt             FORBIDDEN_LANDS_3.3.2_SOURCE.zip FORBIDDEN_LANDS_3.3.2_SOURCE.zip.sha256 SOURCE_ZIP_INTEGRITY.txt
