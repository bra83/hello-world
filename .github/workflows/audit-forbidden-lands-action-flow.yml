name: Audit Forbidden Lands action flow 338 339

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/audit-forbidden-lands-action-flow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming src338 src339 audit
          download_one() {
            local share="$1" file="$2" sha="$3" out="$4"
            curl -fsSL "https://api.firestorage.ai/dev/file/shares/$share/files?maxResults=1000" -o /tmp/files.json
            python3 - "$file" <<'PY'
import json,sys
wanted=sys.argv[1]
data=json.load(open('/tmp/files.json', encoding='utf-8'))
if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
    raise SystemExit('source file not found: '+wanted)
PY
            curl -fsSL -X POST "https://api.firestorage.ai/dev/file/shares/$share/files/$file/download" -o /tmp/dl.json
            url="$(python3 - <<'PY'
import json
print(json.load(open('/tmp/dl.json',encoding='utf-8')).get('downloadUrl') or '')
PY
)"
            test -n "$url"
            curl -fL --retry 5 --retry-delay 2 "$url" -o "$out"
            echo "$sha  $out" | sha256sum -c -
          }
          download_one "HXEoiAEiqyYk" "01a0c29a470b7216b6438c3585b3680e" "f219a8fa54d87f8c04eeab17ee88a83acf5cddd0aaf9d07c60115ef131aa4ec2" "incoming/FL338.zip"
          download_one "IxKLULs6_47Y" "01a0c637df127419993ce47576dcdb7b" "28a61233738b314e4c08aa3b41579af86455d9cb6513ca9e5f97686753353c17" "incoming/FL339.zip"
          unzip -q incoming/FL338.zip -d src338
          unzip -q incoming/FL339.zip -d src339

      - name: Audit action-related source
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== ROOTS ==="
            find src338 src339 -type f \( -name package.json -o -name GeminiGatewayPlugin.java \) | sort
            echo
            echo "=== 3.3.8 ACTION TERMS ==="
            grep -RniE --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle               "Ação Livre|acao livre|adventure-action|predefin|busy|setBusy|send\(|sendAction|cancel|GeminiGateway|Enviado ao Gemini|onClick|pointer|touch" src338 | head -n 2500 || true
            echo
            echo "=== 3.3.9 ACTION TERMS ==="
            grep -RniE --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle               "Ação Livre|acao livre|adventure-action|predefin|busy|setBusy|send\(|sendAction|cancel|GeminiGateway|Enviado ao Gemini|onClick|pointer|touch" src339 | head -n 2500 || true
          } > audit/ACTION_AUDIT.txt

          python3 - <<'PY'
from pathlib import Path
import os, difflib

def files(root):
    out={}
    for p in Path(root).rglob('*'):
        if not p.is_file(): continue
        s=str(p)
        if any(x in s for x in ['/node_modules/','/build/','/.gradle/','/dist/']):
            continue
        if p.suffix.lower() in {'.ts','.tsx','.js','.jsx','.json','.java','.kt','.css','.html','.mjs','.cjs'}:
            rel=str(p.relative_to(root))
            out[rel]=p
    return out

a=files('src338'); b=files('src339')
with open('audit/DIFF_338_339.patch','w',encoding='utf-8') as w:
    for rel in sorted(set(a)|set(b)):
        if rel not in a or rel not in b:
            w.write(f"\n=== FILE PRESENCE {rel}: 338={rel in a} 339={rel in b} ===\n")
            continue
        try:
            x=a[rel].read_text(encoding='utf-8').splitlines(True)
            y=b[rel].read_text(encoding='utf-8').splitlines(True)
        except Exception:
            continue
        if x!=y:
            w.writelines(difflib.unified_diff(x,y,fromfile='338/'+rel,tofile='339/'+rel,n=5))
PY

          # Pack only editable/source material for local forensic review.
          tar -czf audit/FL338_SOURCE_TREE.tar.gz             --exclude='node_modules' --exclude='build' --exclude='.gradle' --exclude='dist' src338
          tar -czf audit/FL339_SOURCE_TREE.tar.gz             --exclude='node_modules' --exclude='build' --exclude='.gradle' --exclude='dist' src339
          cp incoming/FL338.zip audit/
          cp incoming/FL339.zip audit/
          sha256sum audit/* > audit/SHA256SUMS.txt

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-action-audit-338-339
          compression-level: 0
          retention-days: 2
          path: audit/
