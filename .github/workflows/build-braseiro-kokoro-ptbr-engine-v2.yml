name: Braseiro Kokoro PT-BR Engine 1.13.8 V2

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-braseiro-kokoro-ptbr-engine-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHERPA_TAG: v1.13.8
      MODEL_URL: https://huggingface.co/cristianoaredes/kokoro-pt-br/resolve/main/letrinhas-kokoro-pt.zip?download=true
      APK_NAME: BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V2.apk
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sherpa-onnx 1.13.8
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SHERPA_TAG" https://github.com/k2-fsa/sherpa-onnx.git sherpa
          test -f sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsEngine.kt
          test -f sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt

      - name: Download PT-BR Kokoro model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/model
          curl -fL --retry 6 --retry-delay 3 --connect-timeout 30 --max-time 1800 "$MODEL_URL" -o /tmp/kokoro-ptbr.zip
          python3 - <<'PY'
          import os, zipfile, shutil
          src='/tmp/kokoro-ptbr.zip'
          unpack='/tmp/model/unpack'
          os.makedirs(unpack, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(unpack)
          roots=[]
          for root, dirs, files in os.walk(unpack):
              if 'model.onnx' in files and 'voices.bin' in files and 'tokens.txt' in files:
                  roots.append(root)
          if not roots:
              raise SystemExit('Kokoro PT-BR model files not found in ZIP')
          root=min(roots, key=len)
          dest='sherpa/android/SherpaOnnxTtsEngine/app/src/main/assets/kokoro-pt-br'
          shutil.rmtree(dest, ignore_errors=True)
          os.makedirs(dest, exist_ok=True)
          for name in os.listdir(root):
              p=os.path.join(root,name)
              q=os.path.join(dest,name)
              if os.path.isdir(p): shutil.copytree(p,q)
              else: shutil.copy2(p,q)
          required=['model.onnx','voices.bin','tokens.txt','espeak-ng-data']
          for x in required:
              if not os.path.exists(os.path.join(dest,x)):
                  raise SystemExit('Missing '+x)
          print('Model bytes:', sum(os.path.getsize(os.path.join(r,f)) for r,_,fs in os.walk(dest) for f in fs))
          PY

      - name: Install Android native sherpa libraries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2             "https://github.com/k2-fsa/sherpa-onnx/releases/download/$SHERPA_TAG/sherpa-onnx-$SHERPA_TAG-android.tar.bz2"             -o /tmp/sherpa-android.tar.bz2
          mkdir -p /tmp/sherpa-android
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-android
          for arch in arm64-v8a x86_64; do
            dest="sherpa/android/SherpaOnnxTtsEngine/app/src/main/jniLibs/$arch"
            rm -rf "$dest"
            mkdir -p "$dest"
            find /tmp/sherpa-android -type f -path "*/$arch/*.so" -exec cp -v {} "$dest/" \;
            test "$(find "$dest" -type f -name '*.so' | wc -l)" -ge 2
            ls -lh "$dest"
          done

      - name: Patch engine profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('sherpa/android/SherpaOnnxTtsEngine')
          src=root/'app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine'
          engine=src/'TtsEngine.kt'
          service=src/'TtsService.kt'
          prefs=src/'PreferencesHelper.kt'
          check=src/'CheckVoiceData.kt'
          install=src/'InstallVoiceData.kt'
          settings=src/'BraseiroSettingsActivity.kt'
          gradle=root/'app/build.gradle.kts'
          manifest=root/'app/src/main/AndroidManifest.xml'
          strings=root/'app/src/main/res/values/strings.xml'

          s=engine.read_text()
          s=s.replace('import com.k2fsa.sherpa.onnx.OfflineTts\n', 'import com.k2fsa.sherpa.onnx.OfflineTts\nimport com.k2fsa.sherpa.onnx.GenerationConfig\n')
          s=s.replace('modelName = null', 'modelName = "model.onnx"', 1)
          s=s.replace('voices = null', 'voices = "voices.bin"', 1)
          s=s.replace('modelDir = null', 'modelDir = "kokoro-pt-br"', 1)
          s=s.replace('dataDir = null', 'dataDir = "kokoro-pt-br/espeak-ng-data"', 1)
          s=s.replace('lang = null', 'lang = "por"', 1)
          marker='''            voiceStyle = voiceStyle ?: "",\n        )'''
          replacement='''            voiceStyle = voiceStyle ?: "",\n            numThreads = 4,\n        ).copy(\n            maxNumSentences = 2,\n            silenceScale = 0.06f,\n        )'''
          if marker not in s: raise SystemExit('TtsEngine config marker not found')
          s=s.replace(marker,replacement,1)
          s=s.replace('    fun createTts(context: Context) {', '    @Synchronized\n    fun createTts(context: Context) {', 1)
          marker2='''        tts = OfflineTts(assetManager = assets, config = config)'''
          replacement2='''        tts = OfflineTts(assetManager = assets, config = config)\n\n        runCatching {\n            tts!!.generateWithConfig(\n                text = "Olá.",\n                config = GenerationConfig(\n                    sid = 43,\n                    speed = 1.0f,\n                    silenceScale = 0.06f,\n                )\n            )\n        }.onFailure { Log.w(TAG, "Kokoro prewarm failed", it) }'''
          if marker2 not in s: raise SystemExit('OfflineTts init marker not found')
          s=s.replace(marker2,replacement2,1)
          engine.write_text(s)

          p=prefs.read_text()
          p=p.replace('getInt(SID_KEY, 0)', 'getInt(SID_KEY, 43)')
          prefs.write_text(p)

          service.write_text(r'''package com.k2fsa.sherpa.onnx.tts.engine

          import android.media.AudioFormat
          import android.speech.tts.SynthesisCallback
          import android.speech.tts.SynthesisRequest
          import android.speech.tts.TextToSpeech
          import android.speech.tts.TextToSpeechService
          import android.speech.tts.Voice
          import android.util.Log
          import com.k2fsa.sherpa.onnx.GenerationConfig
          import java.util.Locale
          import kotlin.math.min

          class TtsService : TextToSpeechService() {
              private val ptBrVoiceIds = linkedMapOf(
                  "ptbr_pf_dora_42" to 42,
                  "ptbr_pm_alex_43" to 43,
                  "ptbr_pm_santa_44" to 44,
              )

              @Volatile private var stopRequested = false

              override fun onCreate() {
                  super.onCreate()
                  Log.i(TAG, "Braseiro Kokoro service created")
                  Thread({
                      runCatching { TtsEngine.createTts(applicationContext) }
                          .onFailure { Log.e(TAG, "Background prewarm failed", it) }
                  }, "braseiro-kokoro-prewarm").start()
              }

              private fun langResult(lang: String?, country: String?): Int {
                  val l = (lang ?: "").lowercase(Locale.ROOT)
                  val c = (country ?: "").uppercase(Locale.ROOT)
                  if (l != "por" && l != "pt") return TextToSpeech.LANG_NOT_SUPPORTED
                  return if (c == "BRA" || c == "BR") {
                      TextToSpeech.LANG_COUNTRY_AVAILABLE
                  } else {
                      TextToSpeech.LANG_AVAILABLE
                  }
              }

              override fun onIsLanguageAvailable(lang: String?, country: String?, variant: String?): Int =
                  langResult(lang, country)

              override fun onGetLanguage(): Array<String> = arrayOf("por", "BRA", "")

              override fun onLoadLanguage(lang: String?, country: String?, variant: String?): Int =
                  langResult(lang, country)

              override fun onGetVoices(): MutableList<Voice> = ptBrVoiceIds.map { (name, _) ->
                  Voice(name, Locale("pt", "BR"), Voice.QUALITY_HIGH, Voice.LATENCY_LOW,
                      false, setOf("braseiro-kokoro-ptbr", "offline", "neural"))
              }.toMutableList()

              override fun onIsValidVoiceName(voiceName: String?): Int =
                  if (voiceName != null && ptBrVoiceIds.containsKey(voiceName)) TextToSpeech.SUCCESS
                  else TextToSpeech.ERROR

              override fun onLoadVoice(voiceName: String?): Int = onIsValidVoiceName(voiceName)

              override fun onGetDefaultVoiceNameFor(lang: String?, country: String?, variant: String?): String =
                  "ptbr_pm_alex_43"

              private fun speakerIdFor(voiceName: String?): Int =
                  ptBrVoiceIds[voiceName] ?: TtsEngine.speakerId

              override fun onStop() { stopRequested = true }

              override fun onSynthesizeText(request: SynthesisRequest?, callback: SynthesisCallback?) {
                  if (request == null || callback == null) return
                  stopRequested = false
                  if (langResult(request.language, request.country) == TextToSpeech.LANG_NOT_SUPPORTED) {
                      callback.error()
                      return
                  }

                  val text = request.charSequenceText?.toString().orEmpty()
                  val tts = try {
                      TtsEngine.createTts(applicationContext)
                      TtsEngine.tts ?: error("OfflineTts unavailable")
                  } catch (t: Throwable) {
                      Log.e(TAG, "Kokoro init failed", t)
                      callback.error()
                      return
                  }

                  callback.start(tts.sampleRate(), AudioFormat.ENCODING_PCM_16BIT, 1)
                  if (text.isBlank()) {
                      callback.done()
                      return
                  }

                  val rate = runCatching { request.speechRate }.getOrDefault(100)
                  val engineSpeed = (rate / 100.0f).coerceIn(0.55f, 1.20f)
                  var firstAudio = true

                  val ttsCallback: (FloatArray) -> Int = fun(floatSamples): Int {
                      if (stopRequested) return 0
                      val samples = floatArrayToByteArray(floatSamples)
                      val targetBytes = min(callback.maxBufferSize,
                          maxOf(2048, (tts.sampleRate() * 2 * 0.12f).toInt()))

                      if (firstAudio) {
                          firstAudio = false
                          val silence = ByteArray((tts.sampleRate() * 2 * 0.06f).toInt())
                          var sOff = 0
                          while (sOff < silence.size && !stopRequested) {
                              val n = min(targetBytes, silence.size - sOff)
                              callback.audioAvailable(silence, sOff, n)
                              sOff += n
                          }
                      }

                      var offset = 0
                      while (offset < samples.size && !stopRequested) {
                          val n = min(targetBytes, samples.size - offset)
                          callback.audioAvailable(samples, offset, n)
                          offset += n
                      }
                      return if (stopRequested) 0 else 1
                  }

                  try {
                      tts.generateWithConfigAndCallback(
                          text = text,
                          config = GenerationConfig(
                              sid = speakerIdFor(request.voiceName),
                              speed = engineSpeed,
                              silenceScale = 0.06f,
                          ),
                          callback = ttsCallback,
                      )
                      if (!stopRequested) callback.done()
                  } catch (t: Throwable) {
                      Log.e(TAG, "Kokoro synthesis failed", t)
                      callback.error()
                  }
              }

              private fun floatArrayToByteArray(audio: FloatArray): ByteArray {
                  val out = ByteArray(audio.size * 2)
                  for (i in audio.indices) {
                      val v = (audio[i].coerceIn(-1f, 1f) * 32767f).toInt()
                      out[2 * i] = v.toByte()
                      out[2 * i + 1] = (v shr 8).toByte()
                  }
                  return out
              }
          }
          '''.replace("\n          ", "\n").lstrip())

          check.write_text(r'''package com.k2fsa.sherpa.onnx.tts.engine

          import android.content.Intent
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import androidx.appcompat.app.AppCompatActivity

          class CheckVoiceData : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val result = Intent().apply {
                      putStringArrayListExtra(TextToSpeech.Engine.EXTRA_AVAILABLE_VOICES,
                          arrayListOf("por-BRA"))
                      putStringArrayListExtra(TextToSpeech.Engine.EXTRA_UNAVAILABLE_VOICES,
                          arrayListOf())
                  }
                  setResult(TextToSpeech.Engine.CHECK_VOICE_DATA_PASS, result)
                  finish()
              }
          }
          '''.replace("\n          ", "\n").lstrip())

          install.write_text(r'''package com.k2fsa.sherpa.onnx.tts.engine
          import android.app.Activity
          import android.os.Bundle
          class InstallVoiceData : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setResult(RESULT_OK)
                  finish()
              }
          }
          '''.replace("\n          ", "\n").lstrip())

          settings.write_text(r'''package com.k2fsa.sherpa.onnx.tts.engine

          import PreferenceHelper
          import android.app.Activity
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.TextView
          import java.util.Locale

          class BraseiroSettingsActivity : Activity() {
              private var client: TextToSpeech? = null
              private val voiceNames = listOf(
                  "Alex (masculina)" to 43,
                  "Dora (feminina)" to 42,
                  "Santa (masculina)" to 44,
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "Braseiro Kokoro PT-BR"
                  val prefs = PreferenceHelper(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                      gravity = Gravity.TOP
                  }

                  fun label(value: String, size: Float = 18f) = TextView(this).apply {
                      text = value
                      textSize = size
                      setPadding(0, 16, 0, 16)
                  }

                  root.addView(label("Braseiro Kokoro PT-BR", 26f))
                  root.addView(label("Engine neural local pt-BR. Esta tela abre imediatamente; o modelo carrega em segundo plano."))

                  val spinner = Spinner(this)
                  spinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item,
                      voiceNames.map { it.first })
                  val currentSid = prefs.getSid()
                  spinner.setSelection(voiceNames.indexOfFirst { it.second == currentSid }.coerceAtLeast(0))
                  root.addView(label("Voz"))
                  root.addView(spinner, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)

                  val speedText = label("Velocidade: " + "%.2f".format(prefs.getSpeed()) + "×")
                  root.addView(speedText)
                  val speed = SeekBar(this).apply {
                      max = 65
                      progress = ((prefs.getSpeed().coerceIn(0.55f, 1.20f) - 0.55f) * 100f).toInt()
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              val v = 0.55f + progress / 100f
                              speedText.text = "Velocidade: " + "%.2f".format(v) + "×"
                              prefs.setSpeed(v)
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  root.addView(speed)

                  val status = label("Status: pronta para seleção nas configurações de Texto para fala do Android.")
                  root.addView(status)

                  root.addView(Button(this).apply {
                      text = "Salvar voz"
                      setOnClickListener {
                          prefs.setSid(voiceNames[spinner.selectedItemPosition].second)
                          status.text = "Status: voz salva."
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Testar voz"
                      setOnClickListener {
                          prefs.setSid(voiceNames[spinner.selectedItemPosition].second)
                          status.text = "Status: inicializando Kokoro..."
                          client?.shutdown()
                          client = TextToSpeech(this@BraseiroSettingsActivity, { code ->
                              val t = client
                              if (code != TextToSpeech.SUCCESS || t == null) {
                                  runOnUiThread { status.text = "Status: falha ao inicializar." }
                              } else {
                                  t.language = Locale("pt", "BR")
                                  t.setSpeechRate(prefs.getSpeed().coerceIn(0.55f, 1.20f))
                                  val wanted = when (prefs.getSid()) {
                                      42 -> "ptbr_pf_dora_42"
                                      44 -> "ptbr_pm_santa_44"
                                      else -> "ptbr_pm_alex_43"
                                  }
                                  t.voices?.firstOrNull { it.name == wanted }?.let { t.voice = it }
                                  t.speak("As ruínas estão silenciosas. O vento atravessa as pedras quebradas.",
                                      TextToSpeech.QUEUE_FLUSH, null, "braseiro-test")
                                  runOnUiThread { status.text = "Status: teste enviado." }
                              }
                          }, packageName)
                      }
                  })

                  setContentView(root)
              }

              override fun onDestroy() {
                  client?.stop()
                  client?.shutdown()
                  super.onDestroy()
              }
          }
          '''.replace("\n          ", "\n").lstrip())

          g=gradle.read_text()
          g=g.replace('applicationId = "com.k2fsa.sherpa.onnx.tts.engine"', 'applicationId = "com.braseiro.kokoro.ptbr"')
          g=g.replace('versionCode = 20260910', 'versionCode = 1130802')
          g=g.replace('versionName = "1.13.8"', 'versionName = "1.13.8-braseiro-ptbr-v2"')
          needle='''        versionName = "1.13.8-braseiro-ptbr-v2"'''
          # Keep arm64-v8a for the Samsung device and x86_64 for deterministic CI smoke.
          gradle.write_text(g)

          m=manifest.read_text()
          m=m.replace('android:authorities="com.k2fsa.sherpa.onnx.tts.engine.fileprovider"',
                      'android:authorities="com.braseiro.kokoro.ptbr.fileprovider"')
          for cls in ['GetSampleText','CheckVoiceData','InstallVoiceData','TtsService']:
              m=m.replace(f'android:name=".{cls}"',
                          f'android:name="com.k2fsa.sherpa.onnx.tts.engine.{cls}"')
          m=m.replace('android:name=".MainActivity"',
                      'android:name="com.k2fsa.sherpa.onnx.tts.engine.BraseiroSettingsActivity"')
          manifest.write_text(m)

          st=strings.read_text()
          st=st.replace('TTS Engine: Next-gen Kaldi', 'Braseiro Kokoro PT-BR')
          strings.write_text(st)
          PY

          grep -q 'maxNumSentences = 2' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsEngine.kt
          grep -q 'silenceScale = 0.06f' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt
          grep -q 'numThreads = 4' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsEngine.kt
          grep -q 'ptbr_pf_dora_42' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt
          grep -q 'ptbr_pm_alex_43' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt
          grep -q 'ptbr_pm_santa_44' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt
          grep -q 'Braseiro Kokoro PT-BR' sherpa/android/SherpaOnnxTtsEngine/app/src/main/res/values/strings.xml
          grep -q 'por-BRA' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/CheckVoiceData.kt
          grep -q 'arrayOf("por", "BRA", "")' sherpa/android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt
          grep -q 'BraseiroSettingsActivity' sherpa/android/SherpaOnnxTtsEngine/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 PT-BR TTS engine APK
        shell: bash
        working-directory: sherpa/android/SherpaOnnxTtsEngine
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/ENGINE_GRADLE_ASSEMBLE.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate engine APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > ENGINE_APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee ENGINE_APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee ENGINE_APK_SIGNATURE.txt
          unzip -l "$APK_NAME" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK_NAME" | grep -q 'lib/x86_64/'
          unzip -l "$APK_NAME" | grep -q 'assets/kokoro-pt-br/model.onnx'
          unzip -l "$APK_NAME" | grep -q 'assets/kokoro-pt-br/voices.bin'
          unzip -l "$APK_NAME" | grep -q 'assets/kokoro-pt-br/tokens.txt'
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Save patch evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Braseiro Kokoro PT-BR Engine"
            echo "Base sherpa-onnx: $SHERPA_TAG"
            echo "maxNumSentences=2"
            echo "silenceScale=0.06"
            echo "numThreads=4"
            echo "prewarm=Olá."
            echo "streaming=SynthesisCallback.audioAvailable immediate, target <=120ms chunks"
            echo "voices: pf_dora=42 pm_alex=43 pm_santa=44"
          } > ENGINE_PROFILE.txt
          git -C sherpa diff -- android/SherpaOnnxTtsEngine > ENGINE_PATCH.diff || true

      - uses: actions/upload-artifact@v4
        with:
          name: braseiro-kokoro-ptbr-engine-1.13.8-v2
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V2.apk
            BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V2.apk.sha256
            ENGINE_PROFILE.txt
            ENGINE_PATCH.diff
            ENGINE_GRADLE_ASSEMBLE.txt
            ENGINE_APK_ZIP_TEST.txt
            ENGINE_APK_BADGING.txt
            ENGINE_APK_SIGNATURE.txt
