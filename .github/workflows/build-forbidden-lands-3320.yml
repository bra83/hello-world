                  PluginCall call = activeCall;
                  PluginCall sequence = activeSequenceCall;
                  activeCall = null;
                  clearSequenceState();
                  activeUtteranceId = null;
                  activeRequestId = null;
                  activeOffset = 0;
                  if (resolveActive && call != null) call.resolve();
                  if (resolveActive && sequence != null) sequence.resolve();
              }

