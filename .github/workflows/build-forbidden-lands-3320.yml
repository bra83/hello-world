                      if (activeSequenceCall != null) {
                          PluginCall sequence = activeSequenceCall;
                          if (error != null) {
                              clearSequenceState();
                              sequence.reject(error);
                              return;
                          }

                          // Only a real onDone reaches here. No timer/watchdog
                          // advances the Kokoro sequence.
                          if (activeSequenceIndex + 1 < activeSequenceTexts.size()) {
