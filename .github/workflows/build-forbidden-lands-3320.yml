                <input type="range" min=".5" max="1.2" step=".05" value={settings.androidTtsLocalRate ?? 1.0} onChange={e => void update({ androidTtsLocalRate: Number(e.target.value) })} className="w-full" />
                <p className="text-xs text-text-secondary mt-1">1,00× é neutro. A velocidade é aplicada uma única vez pela API TextToSpeech.</p>
              </label>}
          """
          ui = ui[:profile_start] + profile_ui + ui[voice_label:]

          settings.write_text(ui, encoding='utf-8')

          # ------------------------------------------------------------
          # Android package visibility: current Sherpa packages only.
          # ------------------------------------------------------------
          manifest = root/'android/app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'\s*<package android:name="com\.braseiro\.kokoro\.ptbr"\s*/>', '', m)

          packages = [
              'com.k2fsa.sherpa.onnx.tts.engine.debug',
              'com.k2fsa.sherpa.onnx.tts.engine',
          ]
          if '<queries>' not in m:
              queries = '<queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n'
              for package in packages:
                  queries += f'        <package android:name="{package}" />\n'
              queries += '    </queries>\n\n    '
              m = m.replace('<application', queries + '<application', 1)
          else:
              insert = ''
              for package in packages:
                  if f'android:name="{package}"' not in m:
                      insert += f'\n        <package android:name="{package}" />'
              if insert:
                  m = m.replace('<queries>', '<queries>' + insert, 1)

          manifest.write_text(m, encoding='utf-8')

          # ------------------------------------------------------------
          # Version only; no gameplay mechanics touched.
          # ------------------------------------------------------------
          gradle = root/'android/app/build.gradle'
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 303019', 'versionCode 303020')
          g = g.replace('versionName "3.3.19"', 'versionName "3.3.20"')
          gradle.write_text(g, encoding='utf-8')

          package = root/'package.json'
          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '3.3.20'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # ------------------------------------------------------------
          # Focused verifier.
          # ------------------------------------------------------------
          verify = root/'scripts/verify-runtime-3320.mjs'
          verify.write_text(r"""import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const java = fs.readFileSync(new URL('../android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java', import.meta.url), 'utf8');
          const audio = fs.readFileSync(new URL('../src/services/audioEngineV2.ts', import.meta.url), 'utf8');
          const settings = fs.readFileSync(new URL('../src/screens/SettingsScreenV2.tsx', import.meta.url), 'utf8');
          const store = fs.readFileSync(new URL('../src/store/useAppStore.ts', import.meta.url), 'utf8');
          const manifest = fs.readFileSync(new URL('../android/app/src/main/AndroidManifest.xml', import.meta.url), 'utf8');
          const gradle = fs.readFileSync(new URL('../android/app/build.gradle', import.meta.url), 'utf8');

          assert.match(java, /com\.k2fsa\.sherpa\.onnx\.tts\.engine\.debug/);
          assert.match(java, /com\.k2fsa\.sherpa\.onnx\.tts\.engine"/);
          assert.doesNotMatch(java, /"com\.braseiro\.kokoro\.ptbr"\.equals\(configuredEnginePackage\)/);
          assert.match(java, /Braseiro Kokoro PT-BR · neural/);
          assert.match(java, /Set<Voice> available = tts\.getVoices\(\)/);
          assert.match(java, /current\.setVoice\(realVoice\)/);
          assert.doesNotMatch(java, /ptbr_pf_dora|ptbr_pm_alex|ptbr_pm_santa/);
          assert.match(java, /activeSequenceIndex == 0[\s\S]*QUEUE_FLUSH[\s\S]*QUEUE_ADD/);
          assert.match(java, /Only a real onDone reaches here/);
          assert.match(java, /activeSequenceRate = call\.getFloat\("rate", 1\.0f\)/);
          assert.doesNotMatch(java, /playSilentUtterance|Olá\./);

          assert.match(audio, /target = 450, min = 250, max = 650/);
          assert.match(audio, /isBraseiroKokoroPackage\(resolvedEnginePackage\)/);
          assert.doesNotMatch(audio, /\/kokoro\/i\.test/);
          assert.match(audio, /resolvedSelection\.localRate \?\? 1\.0/);
          assert.match(audio, /await NativeAndroidTts\.speakSequence/);
          assert.doesNotMatch(audio.slice(audio.indexOf('if \(Capacitor\.isNativePlatform\(\) && localNeural\)'), audio.indexOf('let globalOffset')), /watchdog|NativeAndroidTts\.stop/);

          assert.match(settings, /Braseiro Kokoro PT-BR · neural/);
          assert.match(settings, /1,00× é neutro/);
          assert.match(settings, /voice\.name === currentVoice/);
          assert.match(settings, /androidTtsVoiceName: nextVoiceName/);

          assert.match(store, /androidTtsLocalRate: 1\.0/);
          assert.match(store, /androidTtsLocalPipelineVersion: 4/);
          assert.match(store, /com\.k2fsa\.sherpa\.onnx\.tts\.engine\.debug/);
          assert.match(store, /migratedKokoro \? 'local-neural' : 'standard'/);

          assert.match(manifest, /com\.k2fsa\.sherpa\.onnx\.tts\.engine\.debug/);
          assert.match(manifest, /com\.k2fsa\.sherpa\.onnx\.tts\.engine/);
          assert.doesNotMatch(manifest, /com\.braseiro\.kokoro\.ptbr/);

          assert.match(gradle, /versionCode 303020/);
          assert.match(gradle, /versionName "3\.3\.20"/);

          console.log('PASS runtime-3320: current Braseiro Kokoro/Sherpa integration, real voices, migration, strict onDone sequence, no neural watchdog.');
          """, encoding='utf-8')
          PY

          cd work
          node scripts/verify-runtime-3320.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and regression gates
        shell: bash
        working-directory: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run verify:runtime-3319
          npm run verify:rules
          node scripts/verify-runtime-3320.mjs

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q "Braseiro Kokoro PT-BR · neural" android/app/src/main/assets/public/assets
          grep -R -q "1,00× é neutro" android/app/src/main/assets/public/assets
          grep -q "com.k2fsa.sherpa.onnx.tts.engine.debug" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -q "com.k2fsa.sherpa.onnx.tts.engine" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          ! grep -q '"com.braseiro.kokoro.ptbr".equals' android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -q "versionCode 303020" android/app/build.gradle
          grep -q 'versionName "3.3.20"' android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and assemble
        shell: bash
        working-directory: ${{ github.workspace }}/work/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest :app:processDebugResources :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_BUILD.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK and source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303020'" APK_BADGING.txt
          grep -q "versionName='3.3.20'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

          (cd work && zip -qr "$GITHUB_WORKSPACE/$SOURCE_OUT" . -x 'node_modules/*' 'android/.gradle/*' 'android/app/build/*')
          unzip -t "$SOURCE_OUT" > SOURCE_OUT_ZIP_TEST.txt
          sha256sum "$SOURCE_OUT" > "$SOURCE_OUT.sha256"

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.20-current-kokoro
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.20.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.20.apk.sha256
            Braseiro_Forbidden_Lands_3.3.20_CURRENT_KOKORO_ANDROID_STUDIO.zip
            Braseiro_Forbidden_Lands_3.3.20_CURRENT_KOKORO_ANDROID_STUDIO.zip.sha256
            APK_BADGING.txt
            APK_SIGNATURE.txt
            APK_ZIP_TEST.txt
            SOURCE_OUT_ZIP_TEST.txt
            GRADLE_BUILD.txt

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="forbidden-lands-3.3.20-current-kokoro"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             "$APK_NAME"             "$APK_NAME.sha256"             "$SOURCE_OUT"             "$SOURCE_OUT.sha256"             --title "Forbidden Lands 3.3.20 — Current Braseiro Kokoro"             --notes "TTS-only hotfix. Uses installed Sherpa/DB Next-gen engine packages com.k2fsa.sherpa.onnx.tts.engine.debug or .engine, canonical label Braseiro Kokoro PT-BR · neural, real TextToSpeech.voices/setVoice, automatic legacy migration, 250–650 char chunks target 450, first QUEUE_FLUSH then QUEUE_ADD only after real onDone, 1.00x neutral local speed, no Kokoro inference watchdog. Gameplay unchanged."
