                              activeUtteranceId = null;
                              activeRequestId = null;
                              activeOffset = 0;
                              startSequenceChunk();
                          } else {
                              clearSequenceState();
                              sequence.resolve();
                          }
                          return;
                      }

                      if (activeCall == null) return;
                      PluginCall call = activeCall;
                      activeCall = null;
                      activeUtteranceId = null;
                      activeRequestId = null;
                      activeOffset = 0;
                      if (error == null) call.resolve();
                      else call.reject(error);
                  });
