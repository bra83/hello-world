name: Forbidden Lands 3.3.20 Current Braseiro Kokoro Integration

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-3320.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: "441fd6e9c0f667bc78a69c5699c371163de52087fd796b0d7ffa3afd60b159b1"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.19_ACTION_TTS_ISOLATION_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "2sonjo9_IOEG"
  FILE_ID: "01a0d25ef27e77b1b77fb761c277ca45"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.20.apk"
  SOURCE_OUT: "Braseiro_Forbidden_Lands_3.3.20_CURRENT_KOKORO_ANDROID_STUDIO.zip"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/files.json
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/download.json
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json')).get('downloadUrl') or '')
          PY
          )"
          test -n "$URL"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Patch only Android TTS integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('work')

          # ------------------------------------------------------------
          # Android native bridge: real engines + real Voice objects only.
          # ------------------------------------------------------------
          plugin = root/'android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java'
          plugin.write_text(r'''package com.braseiro.forbiddenlands;

          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "AndroidTts")
          public class AndroidTtsPlugin extends Plugin {
              private static final String KOKORO_DEBUG = "com.k2fsa.sherpa.onnx.tts.engine.debug";
              private static final String KOKORO_RELEASE = "com.k2fsa.sherpa.onnx.tts.engine";
              private static final String LEGACY_KOKORO = "com.braseiro.kokoro.ptbr";
              private static final String KOKORO_LABEL = "Braseiro Kokoro PT-BR · neural";

              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final ExecutorService ttsControlExecutor = Executors.newSingleThreadExecutor(runnable -> {
                  Thread thread = new Thread(runnable, "braseiro-tts-control");
                  thread.setDaemon(true);
                  return thread;
              });

              private volatile TextToSpeech tts;
              private volatile boolean ready = false;
              private volatile boolean initializationFailed = false;
              private volatile String configuredEnginePackage = "";
              private volatile int engineGeneration = 0;

              private volatile PluginCall activeCall;
              private volatile String activeUtteranceId;
              private volatile String activeRequestId;
              private volatile int activeOffset;

              private volatile PluginCall activeSequenceCall;
              private final List<String> activeSequenceTexts = new ArrayList<>();
              private final List<Integer> activeSequenceOffsets = new ArrayList<>();
              private volatile int activeSequenceIndex = -1;
              private volatile String activeSequenceBaseRequestId = "";
              private volatile float activeSequenceRate = 1.0f;
              private volatile float activeSequencePitch = 1.0f;
              private volatile String activeSequenceLanguage = "pt-BR";
              private volatile String activeSequenceVoiceName = "";

              @Override
              public void load() {
                  initializeTts("");
              }

              private String trimEngine(String enginePackage) {
                  return enginePackage == null ? "" : enginePackage.trim();
              }

              private boolean isKokoroPackage(String packageName) {
                  String value = trimEngine(packageName);
                  return KOKORO_DEBUG.equals(value) || KOKORO_RELEASE.equals(value);
              }

              private boolean isLegacyKokoroToken(String value) {
                  String normalized = trimEngine(value).toLowerCase(Locale.ROOT);
                  return LEGACY_KOKORO.equals(normalized)
                          || normalized.contains("db next")
                          || normalized.contains("db-next")
                          || normalized.contains("next-gen")
                          || normalized.contains("nextgen")
                          || normalized.contains("braseiro kokoro");
              }

              private boolean packageEnabled(String packageName) {
                  if (packageName == null || packageName.trim().isEmpty()) return false;
                  try {
                      ApplicationInfo info = getContext().getPackageManager().getApplicationInfo(packageName, 0);
                      return info.enabled;
                  } catch (Exception ignored) {
                      return false;
                  }
              }

              private String installedKokoroPackage(String preferred) {
                  String requested = trimEngine(preferred);
                  if (isKokoroPackage(requested) && packageEnabled(requested)) return requested;
                  if (packageEnabled(KOKORO_DEBUG)) return KOKORO_DEBUG;
                  if (packageEnabled(KOKORO_RELEASE)) return KOKORO_RELEASE;
                  return "";
              }

              private String resolveRequestedEngine(String raw) {
                  String requested = trimEngine(raw);
                  if (isLegacyKokoroToken(requested)) return installedKokoroPackage("");
                  if (isKokoroPackage(requested) && !packageEnabled(requested)) {
                      String alternative = installedKokoroPackage(requested);
                      return alternative.isEmpty() ? requested : alternative;
                  }
                  return requested;
              }

              private synchronized void initializeTts(String enginePackage) {
                  final String requested = resolveRequestedEngine(enginePackage);
                  if (tts != null && configuredEnginePackage.equals(requested) && !initializationFailed) return;

                  TextToSpeech previous = tts;
                  clearActiveState(true);
                  tts = null;
                  ready = false;
                  initializationFailed = false;
                  configuredEnginePackage = requested;
                  final int generation = ++engineGeneration;

                  if (previous != null) {
                      ttsControlExecutor.execute(() -> {
                          try { previous.stop(); } catch (Exception ignored) {}
                          try { previous.shutdown(); } catch (Exception ignored) {}
                      });
                  }

                  TextToSpeech.OnInitListener listener = status -> {
                      if (generation != engineGeneration) return;
                      ready = status == TextToSpeech.SUCCESS;
                      initializationFailed = !ready;
                      if (!ready) {
                          TextToSpeech failed = tts;
                          tts = null;
                          if (failed != null) {
                              ttsControlExecutor.execute(() -> {
                                  try { failed.shutdown(); } catch (Exception ignored) {}
                              });
                          }
                          return;
                      }
                      installProgressListener();
                  };

                  try {
                      if (requested.isEmpty()) tts = new TextToSpeech(getContext(), listener);
                      else tts = new TextToSpeech(getContext(), listener, requested);
                  } catch (Exception error) {
                      initializationFailed = true;
                      ready = false;
                      tts = null;
                  }
              }

              private void installProgressListener() {
                  TextToSpeech current = tts;
                  if (current == null) return;
                  current.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String utteranceId) {
                          if (activeUtteranceId == null || !activeUtteranceId.equals(utteranceId)) return;
                          final String requestId = activeRequestId == null ? utteranceId : activeRequestId;
                          final int chunkIndex = activeSequenceCall != null ? activeSequenceIndex : -1;
                          mainHandler.post(() -> {
                              JSObject event = new JSObject();
                              event.put("requestId", requestId);
                              if (chunkIndex >= 0) {
                                  event.put("chunkIndex", chunkIndex);
                                  event.put("sequence", true);
                              }
                              notifyListeners("utteranceStart", event);
                          });
                      }

                      @Override public void onRangeStart(String utteranceId, int start, int end, int frame) {
                          if (activeUtteranceId == null || !activeUtteranceId.equals(utteranceId)) return;
                          final String requestId = activeRequestId == null ? utteranceId : activeRequestId;
                          final int offset = activeOffset;
                          mainHandler.post(() -> {
                              JSObject event = new JSObject();
                              event.put("requestId", requestId);
                              event.put("start", start);
                              event.put("end", end);
                              event.put("absoluteStart", offset + start);
                              event.put("absoluteEnd", offset + end);
                              notifyListeners("utteranceRange", event);
                          });
                      }

                      @Override public void onDone(String utteranceId) {
                          finishUtterance(utteranceId, null);
                      }

                      @Override public void onError(String utteranceId) {
                          finishUtterance(utteranceId, "O mecanismo TTS do Android falhou ao reproduzir a fala.");
                      }

                      @Override public void onError(String utteranceId, int errorCode) {
                          finishUtterance(utteranceId, "O mecanismo TTS do Android falhou (código " + errorCode + ").");
                      }

                      @Override public void onStop(String utteranceId, boolean interrupted) {
                          finishUtterance(utteranceId, interrupted ? "A fala do Android foi interrompida." : null);
                      }
                  });
              }

              private void ensureEngine(String enginePackage) {
                  String requested = resolveRequestedEngine(enginePackage);
                  if (tts == null || initializationFailed || !configuredEnginePackage.equals(requested)) {
                      initializeTts(requested);
                  }
              }

              private boolean isBraseiroKokoroEngine() {
                  return isKokoroPackage(configuredEnginePackage);
              }

              private String defaultEnginePackage() {
                  String value = "";
                  try {
                      value = Settings.Secure.getString(getContext().getContentResolver(), "tts_default_synth");
                  } catch (Exception ignored) {}
                  value = resolveRequestedEngine(value);
                  if (!value.isEmpty()) return value;
                  try {
                      TextToSpeech current = tts;
                      if (current != null && ready) return resolveRequestedEngine(current.getDefaultEngine());
                  } catch (Exception ignored) {}
                  return "";
              }

              private String packageLabel(PackageManager packageManager, String packageName) {
                  if (isKokoroPackage(packageName)) return KOKORO_LABEL;
                  try {
                      ApplicationInfo applicationInfo = packageManager.getApplicationInfo(packageName, 0);
                      CharSequence label = packageManager.getApplicationLabel(applicationInfo);
                      return label == null ? packageName : String.valueOf(label);
                  } catch (Exception ignored) {
                      return packageName;
                  }
              }

              private void addDetectedEngine(
                      Map<String, JSObject> engines,
                      PackageManager packageManager,
                      String packageName,
                      String label,
                      String defaultPackage,
                      String detectedBy
              ) {
                  String normalized = trimEngine(packageName);
                  if (normalized.isEmpty() || LEGACY_KOKORO.equals(normalized)) return;
                  try {
                      ApplicationInfo applicationInfo = packageManager.getApplicationInfo(normalized, 0);
                      if (!applicationInfo.enabled) return;
                  } catch (Exception ignored) {
                      if ("system-default".equals(detectedBy)) return;
                  }

                  JSObject item = engines.get(normalized);
                  if (item == null) item = new JSObject();
                  item.put("packageName", normalized);
                  item.put("label", isKokoroPackage(normalized)
                          ? KOKORO_LABEL
                          : (label == null || label.trim().isEmpty() ? packageLabel(packageManager, normalized) : label.trim()));
                  item.put("isDefault", normalized.equals(defaultPackage));
                  item.put("backend", isKokoroPackage(normalized) ? "kokoro" : "android");
                  item.put("detectedBy", detectedBy);
                  engines.put(normalized, item);
              }

              private String collapseKokoroEngines(Map<String, JSObject> detected, String defaultPackage) {
                  boolean hasDebug = detected.containsKey(KOKORO_DEBUG);
                  boolean hasRelease = detected.containsKey(KOKORO_RELEASE);
                  if (!hasDebug && !hasRelease) return defaultPackage;

                  String winner;
                  if (isKokoroPackage(configuredEnginePackage) && detected.containsKey(configuredEnginePackage)) {
                      winner = configuredEnginePackage;
                  } else if (isKokoroPackage(defaultPackage) && detected.containsKey(defaultPackage)) {
                      winner = defaultPackage;
                  } else {
                      winner = hasDebug ? KOKORO_DEBUG : KOKORO_RELEASE;
                  }

                  boolean wasDefault = isKokoroPackage(defaultPackage) || isLegacyKokoroToken(defaultPackage);
                  detected.remove(KOKORO_DEBUG);
                  detected.remove(KOKORO_RELEASE);
                  detected.remove(LEGACY_KOKORO);

                  JSObject item = new JSObject();
                  item.put("packageName", winner);
                  item.put("label", KOKORO_LABEL);
                  item.put("isDefault", wasDefault || winner.equals(defaultPackage));
                  item.put("backend", "kokoro");
                  item.put("detectedBy", "canonical-kokoro");
                  detected.put(winner, item);
                  return wasDefault ? winner : defaultPackage;
              }

              @PluginMethod
              public void listEngines(PluginCall call) {
                  try {
                      PackageManager packageManager = getContext().getPackageManager();
                      String defaultPackage = defaultEnginePackage();
                      Map<String, JSObject> detected = new LinkedHashMap<>();

                      TextToSpeech current = tts;
                      if (current != null) {
                          try {
                              List<TextToSpeech.EngineInfo> list = new ArrayList<>(current.getEngines());
                              for (TextToSpeech.EngineInfo info : list) {
                                  addDetectedEngine(detected, packageManager, info.name, String.valueOf(info.label), defaultPackage, "tts-api");
                              }
                          } catch (Exception ignored) {}
                      }

                      try {
                          Intent intent = new Intent(TextToSpeech.Engine.INTENT_ACTION_TTS_SERVICE);
                          List<ResolveInfo> services = packageManager.queryIntentServices(intent, PackageManager.MATCH_ALL);
                          for (ResolveInfo resolveInfo : services) {
                              if (resolveInfo == null || resolveInfo.serviceInfo == null) continue;
                              if (!resolveInfo.serviceInfo.enabled || resolveInfo.serviceInfo.applicationInfo == null || !resolveInfo.serviceInfo.applicationInfo.enabled) continue;
                              CharSequence serviceLabel = resolveInfo.loadLabel(packageManager);
                              addDetectedEngine(
                                      detected,
                                      packageManager,
                                      resolveInfo.serviceInfo.packageName,
                                      serviceLabel == null ? "" : String.valueOf(serviceLabel),
                                      defaultPackage,
                                      "package-manager"
                              );
                          }
                      } catch (Exception ignored) {}

                      if (!defaultPackage.isEmpty()) {
                          addDetectedEngine(detected, packageManager, defaultPackage, packageLabel(packageManager, defaultPackage), defaultPackage, "system-default");
                      }

                      defaultPackage = collapseKokoroEngines(detected, defaultPackage);

                      List<JSObject> sorted = new ArrayList<>(detected.values());
                      sorted.sort(Comparator.comparing(
                              item -> item.optString("label", item.optString("packageName", "")),
                              String.CASE_INSENSITIVE_ORDER
                      ));

                      JSArray engines = new JSArray();
                      for (JSObject item : sorted) engines.put(item);

                      JSObject response = new JSObject();
                      response.put("engines", engines);
                      response.put("defaultEnginePackage", defaultPackage);
                      call.resolve(response);
                  } catch (Exception error) {
                      call.reject("Não foi possível consultar as engines TTS instaladas.", error);
                  }
              }

              @PluginMethod
              public void listVoices(PluginCall call) {
                  if (initializationFailed) initializationFailed = false;
                  ensureEngine(call.getString("enginePackage", ""));
                  waitForVoices(call, 0);
              }

              private void waitForVoices(PluginCall call, int attempt) {
                  if (ready && tts != null) {
                      try {
                          Set<Voice> available = tts.getVoices();
                          List<Voice> voices = available == null ? new ArrayList<>() : new ArrayList<>(available);
                          voices.sort((a, b) -> {
                              String al = a.getLocale() == null ? "" : a.getLocale().toLanguageTag();
                              String bl = b.getLocale() == null ? "" : b.getLocale().toLanguageTag();
                              boolean apt = al.toLowerCase(Locale.ROOT).startsWith("pt");
                              boolean bpt = bl.toLowerCase(Locale.ROOT).startsWith("pt");
                              if (apt != bpt) return apt ? -1 : 1;
                              int localeCompare = al.compareToIgnoreCase(bl);
                              return localeCompare != 0 ? localeCompare : a.getName().compareToIgnoreCase(b.getName());
                          });

                          JSArray resultVoices = new JSArray();
                          for (Voice voice : voices) {
                              JSObject item = new JSObject();
                              item.put("name", voice.getName());
                              item.put("locale", voice.getLocale() == null ? "" : voice.getLocale().toLanguageTag());
                              item.put("quality", voice.getQuality());
                              item.put("latency", voice.getLatency());
                              item.put("networkRequired", voice.isNetworkConnectionRequired());
                              JSArray features = new JSArray();
                              if (voice.getFeatures() != null) {
                                  for (String feature : voice.getFeatures()) features.put(feature);
                              }
                              item.put("features", features);
                              resultVoices.put(item);
                          }

                          JSObject response = new JSObject();
                          response.put("voices", resultVoices);
                          response.put("enginePackage", configuredEnginePackage);
                          response.put("backend", isBraseiroKokoroEngine() ? "kokoro" : "android");
                          call.resolve(response);
                      } catch (Exception error) {
                          call.reject("A engine TTS iniciou, mas não foi possível ler TextToSpeech.voices.", error);
                      }
                      return;
                  }

                  if (initializationFailed || attempt >= 150) {
                      call.reject("A engine TTS selecionada não iniciou. Verifique se ela está instalada e habilitada no Android.");
                      return;
                  }
                  mainHandler.postDelayed(() -> waitForVoices(call, attempt + 1), 100);
              }

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  if (initializationFailed) initializationFailed = false;
                  ensureEngine(call.getString("enginePackage", ""));
                  waitForReady(call, 0, true);
              }

              private Voice findVoiceByName(String voiceName) {
                  if (tts == null || voiceName == null || voiceName.trim().isEmpty()) return null;
                  try {
                      Set<Voice> voices = tts.getVoices();
                      if (voices == null) return null;
                      String wanted = voiceName.trim();
                      for (Voice voice : voices) {
                          if (wanted.equals(voice.getName())) return voice;
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private String configureVoiceAndProsody(String voiceName, String language, float rate, float pitch) {
                  TextToSpeech current = tts;
                  if (current == null) return "A engine TTS não está pronta.";

                  try {
                      String requestedVoice = voiceName == null ? "" : voiceName.trim();
                      if (!requestedVoice.isEmpty()) {
                          Voice realVoice = findVoiceByName(requestedVoice);
                          if (realVoice == null) {
                              return "A voz real selecionada não existe mais nesta engine: " + requestedVoice;
                          }
                          int result = current.setVoice(realVoice);
                          if (result != TextToSpeech.SUCCESS) {
                              return "A engine recusou a voz Android selecionada: " + requestedVoice;
                          }
                      } else if (!isBraseiroKokoroEngine()) {
                          Locale locale = Locale.forLanguageTag(language == null || language.trim().isEmpty() ? "pt-BR" : language);
                          int result = current.setLanguage(locale);
                          if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                              locale = new Locale("pt", "BR");
                              result = current.setLanguage(locale);
                          }
                          if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                              return "A voz em português do Android não está instalada nesta engine.";
                          }
                      }

                      current.setSpeechRate(Math.max(0.5f, Math.min(2.0f, rate)));
                      current.setPitch(Math.max(0.5f, Math.min(2.0f, pitch)));
                      return null;
                  } catch (Exception error) {
                      return "A engine TTS lançou uma exceção ao aplicar a voz real: " + error.getMessage();
                  }
              }

              @PluginMethod
              public void speakSequence(PluginCall call) {
                  JSArray chunks = call.getArray("chunks");
                  if (chunks == null || chunks.length() == 0) {
                      call.reject("Nenhum bloco foi recebido para a fila TTS local.");
                      return;
                  }
                  if (initializationFailed) initializationFailed = false;
                  ensureEngine(call.getString("enginePackage", ""));
                  waitForReadySequence(call, 0);
              }

              private void waitForReadySequence(PluginCall call, int attempt) {
                  if (ready && tts != null) {
                      startSequence(call);
                      return;
                  }
                  if (initializationFailed || attempt >= 150) {
                      call.reject("O mecanismo TTS local não iniciou. Verifique a engine e a voz instaladas.");
                      return;
                  }
                  mainHandler.postDelayed(() -> waitForReadySequence(call, attempt + 1), 100);
              }

              private void startSequence(PluginCall call) {
                  // Retire only Braseiro bookkeeping. Do not call stop() here:
                  // the first new utterance uses QUEUE_FLUSH exactly once.
                  clearActiveState(true);

                  JSArray chunks = call.getArray("chunks");
                  activeSequenceTexts.clear();
                  activeSequenceOffsets.clear();
                  try {
                      for (int i = 0; i < chunks.length(); i++) {
                          JSONObject item = chunks.getJSONObject(i);
                          String text = item.optString("text", "").trim();
                          if (text.isEmpty()) continue;
                          activeSequenceTexts.add(text);
                          activeSequenceOffsets.add(item.optInt("offset", 0));
                      }
                  } catch (Exception error) {
                      clearSequenceState();
                      call.reject("A fila TTS local recebeu blocos inválidos.", error);
                      return;
                  }

                  if (activeSequenceTexts.isEmpty()) {
                      clearSequenceState();
                      call.reject("A fila TTS local ficou vazia após validar os blocos.");
                      return;
                  }

                  activeSequenceCall = call;
                  activeSequenceIndex = 0;
                  activeSequenceBaseRequestId = call.getString("requestId", "android-local-" + UUID.randomUUID());
                  activeSequenceRate = call.getFloat("rate", 1.0f);
                  activeSequencePitch = call.getFloat("pitch", 1.0f);
                  activeSequenceLanguage = call.getString("language", "pt-BR");
                  activeSequenceVoiceName = call.getString("voiceName", "");

                  String error = configureVoiceAndProsody(
                          activeSequenceVoiceName,
                          activeSequenceLanguage,
                          activeSequenceRate,
                          activeSequencePitch
                  );
                  if (error != null) {
                      PluginCall sequence = activeSequenceCall;
                      clearSequenceState();
                      if (sequence != null) sequence.reject(error);
                      return;
                  }
                  startSequenceChunk();
              }

              private void startSequenceChunk() {
                  if (activeSequenceCall == null || tts == null || activeSequenceIndex < 0 || activeSequenceIndex >= activeSequenceTexts.size()) return;

                  String text = activeSequenceTexts.get(activeSequenceIndex);
                  activeUtteranceId = "braseiro_local_" + activeSequenceIndex + "_" + UUID.randomUUID();
                  activeRequestId = activeSequenceBaseRequestId + ":" + activeSequenceIndex;
                  activeOffset = activeSequenceOffsets.get(activeSequenceIndex);

                  Bundle params = new Bundle();
                  int queueMode = activeSequenceIndex == 0
                          ? TextToSpeech.QUEUE_FLUSH
                          : TextToSpeech.QUEUE_ADD;
                  int result;
                  try {
                      result = tts.speak(text, queueMode, params, activeUtteranceId);
                  } catch (Exception error) {
                      result = TextToSpeech.ERROR;
                  }

                  if (result == TextToSpeech.ERROR) {
                      int failedIndex = activeSequenceIndex;
                      PluginCall sequence = activeSequenceCall;
                      clearSequenceState();
                      if (sequence != null) {
                          sequence.reject("A engine TTS local recusou o bloco " + (failedIndex + 1) + ".");
                      }
                  }
              }

              @PluginMethod
              public void speak(PluginCall call) {
                  String text = call.getString("text", "").trim();
                  if (text.isEmpty()) {
                      call.reject("Texto vazio para a voz do Android.");
                      return;
                  }
                  if (initializationFailed) initializationFailed = false;
                  ensureEngine(call.getString("enginePackage", ""));
                  waitForReady(call, 0, false);
              }

              private void waitForReady(PluginCall call, int attempt, boolean availabilityOnly) {
                  if (ready && tts != null) {
                      if (availabilityOnly) {
                          JSObject response = new JSObject();
                          response.put("available", true);
                          response.put("language", "pt-BR");
                          response.put("enginePackage", configuredEnginePackage);
                          response.put("backend", isBraseiroKokoroEngine() ? "kokoro" : "android");
                          call.resolve(response);
                      } else {
                          startSpeaking(call);
                      }
                      return;
                  }

                  if (initializationFailed || attempt >= 150) {
                      if (availabilityOnly) {
                          JSObject response = new JSObject();
                          response.put("available", false);
                          response.put("enginePackage", configuredEnginePackage);
                          call.resolve(response);
                      } else {
                          call.reject("O mecanismo TTS do Android não iniciou. Verifique se a engine e a voz estão instaladas.");
                      }
                      return;
                  }

                  mainHandler.postDelayed(() -> waitForReady(call, attempt + 1, availabilityOnly), 100);
              }

              private void startSpeaking(PluginCall call) {
                  String queueMode = call.getString("queueMode", "flush");
                  boolean queueAdd = "add".equalsIgnoreCase(queueMode);

