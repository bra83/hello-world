name: Forbidden Lands 3.3.19 Action Freeze Hotfix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-3319b.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA256: "3548652a60d4d3c7e11eef072028cbdbdf244531be1487d689f1d36ba9dba4c3"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.18_KOKORO_STREAMING_PROFILE_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "074j3IuXdyPA"
  FILE_ID: "01a0ce2b83897377a093fb98687637a3"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.18 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.18 source not found')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" > SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Patch 3.3.19 action freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('work')
          p=root/'src/screens/AdventureScreenV3.tsx'
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            'const MASTER_ACTION_HARD_DEADLINE_MS = 28_000;',
            'const MASTER_ACTION_HARD_DEADLINE_MS = 28_000;\nconst MASTER_CONTEXT_HARD_DEADLINE_MS = 5_000;'
          )

          old="""    const text = (forced || input).trim();
    if (!text || busy || masterPending) return;
    const actor = characters.find(character => character.id === actorOverrideId) || activeCharacter;"""
          new="""    const text = (forced || input).trim();
    if (!text || busy || masterPending) return;

    audioEngine.stopNarration();
    if (playing) {
      setPlaying(false);
      window.dispatchEvent(new CustomEvent('master_narration_ended', {
        detail: { sceneId: latestScene?.id, source: 'forbidden_lands', interrupted: true, reason: 'new_action' },
      }));
    }

    const actor = characters.find(character => character.id === actorOverrideId) || activeCharacter;"""
          if old not in s: raise SystemExit('send start marker missing')
          s=s.replace(old,new,1)

          old="""          if (!destination.terrainConfirmed) {
            const analyzed = await TerrainAnalysisService.analyzeHex(destination);
            setTerrain({ hex: analyzed, action: text, initial: false });
            setTerrainChoice(analyzed.visualTerrainAnalysis?.suggestedTerrain !== 'uncertain'
              ? analyzed.visualTerrainAnalysis?.suggestedTerrain || ''
              : analyzed.physicalTerrain !== 'review' ? analyzed.physicalTerrain || '' : '');
            return;
          }"""
          new="""          if (!destination.terrainConfirmed) {
            setTerrain({ hex: destination, action: text, initial: false });
            setTerrainChoice(destination.visualTerrainAnalysis?.suggestedTerrain !== 'uncertain'
              ? destination.visualTerrainAnalysis?.suggestedTerrain || ''
              : destination.physicalTerrain !== 'review' ? destination.physicalTerrain || '' : '');
            setMessage('Confirme o terreno do destino para continuar a ação.');
            setBusy(false);
            await yieldToUi();
            return;
          }"""
          if old not in s: raise SystemExit('blocking terrain marker missing')
          s=s.replace(old,new,1)

          old="""    const context = await MasterContextBuilder.build({
      campaign: active,
      characters,
      currentHex: current,
      destinationHex: destination,
      scenes,
      actingCharacter: actor,
      playerText,
      initial,
    });"""
          new="""    let context: any;
    try {
      context = await withHardDeadline(
        MasterContextBuilder.build({
          campaign: active,
          characters,
          currentHex: current,
          destinationHex: destination,
          scenes,
          actingCharacter: actor,
          playerText,
          initial,
        }),
        MASTER_CONTEXT_HARD_DEADLINE_MS,
        'MASTER_CONTEXT_TIMEOUT',
      );
    } catch (contextError: any) {
      if (!/MASTER_CONTEXT_TIMEOUT/i.test(String(contextError?.message || contextError))) throw contextError;
      const fallbackWorld = worldState || WorldStateService.normalize(null, active.id);
      const previous = [...scenes].reverse().find(item => item.advancesFiction !== false);
      context = {
        worldState: fallbackWorld,
        npcs: [],
        memoryContext: previous
          ? `CENA ${previous.sequence ?? '?'} — ${previous.title}\nAção: ${previous.playerText || 'abertura'}\nResumo: ${previous.summary || ''}\nTrecho final: ${String(previous.narration || '').slice(-700)}`
          : 'Nenhuma cena canônica anterior disponível.',
        worldContext: 'Contexto detalhado excedeu o orçamento desta ação. Preserve os fatos da cena e não invente mecânicas.',
        ruleContext: '',
        campaignNotesContext: '',
        ruleCitations: [],
        environmentContext: `Local atual: ${current.terrainResolution?.finalTerrainLabel || current.physicalTerrainLabel || current.terrain || 'terras selvagens'}.`,
        environmentCues: [],
      };
      setMessage('Contexto pesado ignorado; enviando a ação ao Mestre...');
      await yieldToUi();
    }"""
          if old not in s: raise SystemExit('context marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          gradle=root/'android/app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=g.replace('versionCode 303018','versionCode 303019')
          g=g.replace('versionName "3.3.18"','versionName "3.3.19"')
          gradle.write_text(g,encoding='utf-8')

          package=root/'package.json'
          data=json.loads(package.read_text(encoding='utf-8'))
          data['version']='3.3.19'
          package.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          grep -q "MASTER_CONTEXT_HARD_DEADLINE_MS = 5_000" work/src/screens/AdventureScreenV3.tsx
          grep -q "audioEngine.stopNarration();" work/src/screens/AdventureScreenV3.tsx
          grep -q "reason: 'new_action'" work/src/screens/AdventureScreenV3.tsx
          grep -q "MASTER_CONTEXT_TIMEOUT" work/src/screens/AdventureScreenV3.tsx
          grep -q "Contexto pesado ignorado" work/src/screens/AdventureScreenV3.tsx
          grep -q "Confirme o terreno do destino" work/src/screens/AdventureScreenV3.tsx
          ! grep -q "const analyzed = await TerrainAnalysisService.analyzeHex(destination)" work/src/screens/AdventureScreenV3.tsx
          grep -q "versionCode 303019" work/android/app/build.gradle
          grep -q 'versionName "3.3.19"' work/android/app/build.gradle

      - name: Locate Android and web roots
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/gradlew" ] && [ -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ] && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              ANDROID_ROOT="$candidate"
              break
            fi
          done < <(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          test -n "$ANDROID_ROOT"
          WEB_ROOT="$(dirname "$ANDROID_ROOT")"
          test -f "$WEB_ROOT/package.json"
          chmod +x "$ANDROID_ROOT/gradlew"
          echo "android_root=$GITHUB_WORKSPACE/$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$GITHUB_WORKSPACE/$WEB_ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and focused gates
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run verify:runtime-3318
          npm run verify:rules

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q "TTS local neural / Kokoro — streaming contínuo" android/app/src/main/assets/public/assets
          grep -q "isBraseiroKokoroEngine" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -q "com.braseiro.kokoro.ptbr" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -R -q "Velocidade Kokoro / local" android/app/src/main/assets/public/assets
          grep -q "public void speakSequence" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -q "TextToSpeech.QUEUE_ADD" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          ! grep -R -q "await NativeAndroidTts.speakBufferedSequence" android/app/src/main/assets/public/assets
          grep -R -q "250–650" android/app/src/main/assets/public/assets
          grep -R -q "Gerar ou trocar retrato" android/app/src/main/assets/public/assets
          grep -q "versionCode 303019" android/app/build.gradle
          grep -q 'versionName "3.3.19"' android/app/build.gradle
          grep -R -q "Contexto pesado ignorado" android/app/src/main/assets/public/assets
          grep -R -q "Confirme o terreno do destino" android/app/src/main/assets/public/assets
          grep -R -q "new_action" android/app/src/main/assets/public/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Android
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew --version --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_VERSION.txt"
          ./gradlew projects --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_PROJECTS.txt"
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_RESOURCES.txt"
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_COMPILE.txt"

      - name: Assemble APK
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_ASSEMBLE.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303019'" APK_BADGING.txt
          grep -q "versionName='3.3.19'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Upload APK before smoke
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.19-test-apk
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk.sha256
            APK_BADGING.txt
            APK_SIGNATURE.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r "$APK_NAME"
            adb shell pm clear com.braseiro.forbiddenlands
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 12
            adb shell pidof com.braseiro.forbiddenlands
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            adb logcat -d -t 1200 > FORBIDDEN_LANDS_3.3.19_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.19_LOGCAT.txt

      - name: Upload validated APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.19-validated
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk.sha256
            APK_ZIP_TEST.txt
            APK_BADGING.txt
            APK_SIGNATURE.txt
            GRADLE_VERSION.txt
            GRADLE_PROJECTS.txt
            GRADLE_RESOURCES.txt
            GRADLE_COMPILE.txt
            GRADLE_ASSEMBLE.txt
            FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            FORBIDDEN_LANDS_3.3.19_LOGCAT.txt
            SOURCE_ZIP_INTEGRITY.txt

# trigger-3318
