name: Forbidden Lands 3.3.10 Action Freeze Root Cause Fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-3310.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SOURCE_SHA256: "28a61233738b314e4c08aa3b41579af86455d9cb6513ca9e5f97686753353c17"
  BASE_SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.9_TTS_ACTION_FIX_ANDROID_STUDIO.zip"
  PATCH_PATH: "forbidden-lands/patches/forbidden-lands-3310.patch"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "IxKLULs6_47Y"
  FILE_ID: "01a0c637df127419993ce47576dcdb7b"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.10.apk"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.10_ACTION_FREEZE_FIX_ANDROID_STUDIO.zip"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.9 baseline not found')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$BASE_SOURCE_NAME"
          echo "$BASE_SOURCE_SHA256  incoming/$BASE_SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$BASE_SOURCE_NAME" > BASE_SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$BASE_SOURCE_NAME" -d work

      - name: Locate project roots
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/gradlew" ] && [ -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ] && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              ANDROID_ROOT="$candidate"
              break
            fi
          done < <(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          test -n "$ANDROID_ROOT"
          WEB_ROOT="$(dirname "$ANDROID_ROOT")"
          test -f "$WEB_ROOT/package.json"
          chmod +x "$ANDROID_ROOT/gradlew"
          echo "android_root=$GITHUB_WORKSPACE/$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$GITHUB_WORKSPACE/$WEB_ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply audited 3.3.10 patch
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          patch -p1 < "$GITHUB_WORKSPACE/$PATCH_PATH"
          test ! -e src/services/RulesRetrievalService.ts.rej
          grep -q "APP_VERSION = '3.3.10'" src/version.ts
          grep -q "ANDROID_VERSION_CODE = 303010" src/version.ts
          grep -q "COOPERATIVE_BATCH" src/services/RulesRetrievalService.ts
          grep -q "Ação recebida. Preparando o Mestre" src/screens/AdventureScreenV3.tsx
          grep -q "networkExecutor.submit" android/app/src/main/java/com/braseiro/forbiddenlands/GeminiGatewayPlugin.java

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and run action-freeze gates
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run lint
          npm run verify:runtime-3310
          npm run verify:rules

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q "Ação recebida. Preparando o Mestre" android/app/src/main/assets/public/assets
          grep -R -q "Preparando contexto da ação sem bloquear a tela" android/app/src/main/assets/public/assets
          grep -R -q "Enviado ao Gemini" android/app/src/main/assets/public/assets
          grep -R -q "adventure-action-button" android/app/src/main/assets/public/assets
          grep -R -q "não trocou para a voz Android" android/app/src/main/assets/public/assets
          grep -q "public void generateTts" android/app/src/main/java/com/braseiro/forbiddenlands/GeminiGatewayPlugin.java
          grep -q "/v1beta/interactions" android/app/src/main/java/com/braseiro/forbiddenlands/GeminiGatewayPlugin.java

      - name: Package final Android Studio source
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/$SOURCE_NAME" .             -x 'node_modules/*' 'dist/*' 'server-dist/*' 'android/.gradle/*' 'android/app/build/*' '.git/*'
          unzip -t "$GITHUB_WORKSPACE/$SOURCE_NAME" > "$GITHUB_WORKSPACE/SOURCE_ZIP_INTEGRITY.txt"
          sha256sum "$GITHUB_WORKSPACE/$SOURCE_NAME" > "$GITHUB_WORKSPACE/$SOURCE_NAME.sha256"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper and projects
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew --version --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_VERSION.txt"
          ./gradlew projects --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_PROJECTS.txt"

      - name: Compile Android
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_RESOURCES.txt"
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_COMPILE.txt"

      - name: Assemble APK
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_ASSEMBLE.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303010'" APK_BADGING.txt
          grep -q "versionName='3.3.10'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Upload APK and source before smoke
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.10-test-apk-source
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.10.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.10.apk.sha256
            Braseiro_Forbidden_Lands_3.3.10_ACTION_FREEZE_FIX_ANDROID_STUDIO.zip
            Braseiro_Forbidden_Lands_3.3.10_ACTION_FREEZE_FIX_ANDROID_STUDIO.zip.sha256
            APK_BADGING.txt
            APK_SIGNATURE.txt
            SOURCE_ZIP_INTEGRITY.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1440x3088
            adb shell wm density 560
            adb install -r "$APK_NAME"
            adb shell pm clear com.braseiro.forbiddenlands
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 12
            adb shell pidof com.braseiro.forbiddenlands
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.10_FIRST_LAUNCH.png
            adb logcat -d -t 1200 > FORBIDDEN_LANDS_3.3.10_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.10_LOGCAT.txt

      - name: Upload validated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.10-validated
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.10.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.10.apk.sha256
            Braseiro_Forbidden_Lands_3.3.10_ACTION_FREEZE_FIX_ANDROID_STUDIO.zip
            Braseiro_Forbidden_Lands_3.3.10_ACTION_FREEZE_FIX_ANDROID_STUDIO.zip.sha256
            APK_ZIP_TEST.txt
            APK_BADGING.txt
            APK_SIGNATURE.txt
            GRADLE_VERSION.txt
            GRADLE_PROJECTS.txt
            GRADLE_RESOURCES.txt
            GRADLE_COMPILE.txt
            GRADLE_ASSEMBLE.txt
            FORBIDDEN_LANDS_3.3.10_FIRST_LAUNCH.png
            FORBIDDEN_LANDS_3.3.10_LOGCAT.txt
            BASE_SOURCE_ZIP_INTEGRITY.txt
            SOURCE_ZIP_INTEGRITY.txt
