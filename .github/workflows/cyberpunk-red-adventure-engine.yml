name: Cyberpunk RED Adventure Engine
on:
  push:
    branches: [cyberpunk-red-adventure-engine-r572]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cyberpunk-red/adventure-engine/tests/*.test.mjs
