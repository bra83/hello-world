name: Star Wars Edge R54 P29 Scene Illustration Fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/starwars-r54-p29-scene-illustration.yml"
      - "starwars-p29-worker/patch_starwars_p29.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_URL: "https://github.com/bra83/hello-world/releases/download/star-wars-edge-r54-p28-scene-image-return/STAR_WARS_EDGE_OF_THE_GALAXY_R54_P28_ANDROID_STUDIO.zip"
  SOURCE_SHA256: "fa3862dba805d663cc15a64bb96524d83143e02e13665d3c8be858bd8a063a03"
  APK_NAME: "BRASEIRO_STAR_WARS_EDGE_R54_P29_DEBUG.apk"
  SOURCE_ZIP_NAME: "STAR_WARS_EDGE_OF_THE_GALAXY_R54_P29_ANDROID_STUDIO.zip"
  RELEASE_TAG: "star-wars-edge-r54-p29-scene-illustration-fix"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download exact verified P28 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          curl -fL --retry 4 --retry-delay 2 -o incoming/source.zip "$SOURCE_URL"
          echo "$SOURCE_SHA256  incoming/source.zip" | sha256sum -c -
          unzip -t incoming/source.zip >/dev/null
          unzip -q incoming/source.zip -d work
          test -f work/android/gradlew

      - name: Apply P29 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 starwars-p29-worker/patch_starwars_p29.py work/android
          node --check work/android/app/src/main/assets/vtt/r46/final-runtime.js
          grep -Fq 'R54_P29_SCENE_IMAGE_NATIVE_EVENT' work/android/app/src/main/assets/vtt/r46/final-runtime.js
          grep -Fq 'slice(0,620)' work/android/app/src/main/assets/vtt/r46/final-runtime.js
          grep -Fq 'generateSceneImage(prompt,sceneKey)' work/android/app/src/main/assets/vtt/r46/final-runtime.js
          ! grep -Fq '⇧ IMPORTAR' work/android/app/src/main/assets/vtt/r46/final-runtime.js
          grep -Fq '900-1400 palavras' work/android/app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java
          ! grep -Fq '280-480 palavras' work/android/app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java

      - name: Semantic regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/android')
          rt=(root/'app/src/main/assets/vtt/r46/final-runtime.js').read_text('utf-8')
          gj=(root/'app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java').read_text('utf-8')
          sp=re.search(r'function sceneGeminiPrompt\(\)\{[\s\S]*?\n\}',rt).group(0)
          sb=re.search(r'function enhanceSceneGeminiButton\(\)\{[\s\S]*?\n\}',rt).group(0)
          assert 'slice(0,620)' in sp
          assert 'Narração visível ao jogador' not in sp
          assert 'data-r54-scene-illustration' in sb
          assert 'generateSceneImage(prompt,sceneKey)' in sb
          assert 'braseiroGeminiNativeEvent' in sb
          assert 'pickSceneImage' not in sb
          assert 'openGeminiWithPrompt' not in sb
          assert 'IMPORTAR' not in sb
          assert '900-1400 palavras' in gj
          assert '280-480 palavras' not in gj
          print('P29_SEMANTIC_GATE=PASS prompt=620 native_event=1 delegated_click=1 import=0 narration_restored=1')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile and validate P29 APK
        working-directory: work/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --no-daemon --stacktrace
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD_P29.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING_P29.txt"
          grep -q "package: name='com.braseiro.starwarsedge'" "$GITHUB_WORKSPACE/out/APK_BADGING_P29.txt"
          grep -q "versionCode='10002'" "$GITHUB_WORKSPACE/out/APK_BADGING_P29.txt"
          grep -q "versionName='1.0.2'" "$GITHUB_WORKSPACE/out/APK_BADGING_P29.txt"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_SIGNATURE_P29.txt"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"

      - name: Package Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/android/.gradle work/android/build work/android/app/build
          (cd work && zip -qr "$GITHUB_WORKSPACE/out/$SOURCE_ZIP_NAME" android)
          unzip -t "$GITHUB_WORKSPACE/out/$SOURCE_ZIP_NAME" > "$GITHUB_WORKSPACE/out/P29_SOURCE_ZIP_INTEGRITY.txt"
          sha256sum "$GITHUB_WORKSPACE/out/$SOURCE_ZIP_NAME" > "$GITHUB_WORKSPACE/out/$SOURCE_ZIP_NAME.sha256"

      - name: Publish P29 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA"             --title "BRASEIRO Star Wars Edge R54 P29 — Scene Illustration Fix"             --notes "P29 fixes the S23 report that the scene ILUSTRAÇÃO button did nothing. The button now uses stable delegated click handling, the native Gemini image bridge and the native generated event/readback path; there is no IMPORTAR button. The hidden image prompt is reduced to a maximum of 620 characters and remains original/non-franchise-specific. The visible Master narration is restored to the longer P26 contract and is not shortened by this image optimization. TTS and the working Master connection are unchanged."
          gh release upload "$RELEASE_TAG"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             "out/$SOURCE_ZIP_NAME"             "out/$SOURCE_ZIP_NAME.sha256"             out/APK_BADGING_P29.txt             out/APK_SIGNATURE_P29.txt             out/GRADLE_BUILD_P29.log             out/P29_SOURCE_ZIP_INTEGRITY.txt
