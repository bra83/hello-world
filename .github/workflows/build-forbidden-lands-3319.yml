name: Forbidden Lands 3.3.19 Action Freeze Hotfix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-3319.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: "3548652a60d4d3c7e11eef072028cbdbdf244531be1487d689f1d36ba9dba4c3"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.18_KOKORO_STREAMING_PROFILE_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "074j3IuXdyPA"
  FILE_ID: "01a0ce2b83897377a093fb98687637a3"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk"
  SOURCE_OUT: "Braseiro_Forbidden_Lands_3.3.19_ACTION_FREEZE_HOTFIX_ANDROID_STUDIO.zip"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.18 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.18 source not found')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" > SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Patch 3.3.19 action freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('work')
          adventure=root/'src/screens/AdventureScreenV3.tsx'
          s=adventure.read_text(encoding='utf-8')

          s=s.replace(
              'const MASTER_ACTION_HARD_DEADLINE_MS = 28_000;',
              'const MASTER_ACTION_HARD_DEADLINE_MS = 28_000;\nconst MASTER_CONTEXT_HARD_DEADLINE_MS = 5_000;'
          )

          needle="""    const text = (forced || input).trim();
    if (!text || busy || masterPending) return;
    const actor = characters.find(character => character.id === actorOverrideId) || activeCharacter;"""
          repl="""    const text = (forced || input).trim();
    if (!text || busy || masterPending) return;

    // 3.3.19: uma nova ação sempre interrompe a narração anterior antes de
    // iniciar contexto/RAG/Gemini. Kokoro local pode continuar inferindo mesmo
    // após o áudio audível terminar e competir por CPU com o WebView.
    audioEngine.stopNarration();
    if (playing) {
      setPlaying(false);
      window.dispatchEvent(new CustomEvent('master_narration_ended', {
        detail: { sceneId: latestScene?.id, source: 'forbidden_lands', interrupted: true, reason: 'new_action' },
      }));
    }

    const actor = characters.find(character => character.id === actorOverrideId) || activeCharacter;"""
          if needle not in s:
              raise SystemExit('send() start marker not found')
          s=s.replace(needle,repl,1)

          old="""          if (!destination.terrainConfirmed) {
            const analyzed = await TerrainAnalysisService.analyzeHex(destination);
            setTerrain({ hex: analyzed, action: text, initial: false });
            setTerrainChoice(analyzed.visualTerrainAnalysis?.suggestedTerrain !== 'uncertain'
              ? analyzed.visualTerrainAnalysis?.suggestedTerrain || ''
              : analyzed.physicalTerrain !== 'review' ? analyzed.physicalTerrain || '' : '');
            return;
          }"""
          new="""          if (!destination.terrainConfirmed) {
            // 3.3.19: NUNCA chame Gemini Vision/análise visual na frente do toque.
            // Abra a confirmação imediatamente com os dados já existentes. Isso
            // elimina o congelamento de ações sugeridas de viagem.
            setTerrain({ hex: destination, action: text, initial: false });
            setTerrainChoice(destination.visualTerrainAnalysis?.suggestedTerrain !== 'uncertain'
              ? destination.visualTerrainAnalysis?.suggestedTerrain || ''
              : destination.physicalTerrain !== 'review' ? destination.physicalTerrain || '' : '');
            setMessage('Confirme o terreno do destino para continuar a ação.');
            setBusy(false);
            await yieldToUi();
            return;
          }"""
          if old not in s:
              raise SystemExit('blocking destination terrain analysis marker not found')
          s=s.replace(old,new,1)

          old_context="""    const context = await MasterContextBuilder.build({
      campaign: active,
      characters,
      currentHex: current,
      destinationHex: destination,
      scenes,
      actingCharacter: actor,
      playerText,
      initial,
    });"""
          new_context="""    let context: any;
    try {
      context = await withHardDeadline(
        MasterContextBuilder.build({
          campaign: active,
          characters,
          currentHex: current,
          destinationHex: destination,
          scenes,
          actingCharacter: actor,
          playerText,
          initial,
        }),
        MASTER_CONTEXT_HARD_DEADLINE_MS,
        'MASTER_CONTEXT_TIMEOUT',
      );
    } catch (contextError: any) {
      if (!/MASTER_CONTEXT_TIMEOUT/i.test(String(contextError?.message || contextError))) throw contextError;

      // O RAG detalhado é enriquecimento. Ele não pode congelar a ação.
      // Sem citações, RuleAuthorityService continuará bloqueando qualquer
      // resolução mecânica que exija fonte; portanto este fallback é seguro.
      const fallbackWorld = worldState || WorldStateService.normalize(null, active.id);
      const previous = [...scenes].reverse().find(item => item.advancesFiction !== false);
      context = {
        worldState: fallbackWorld,
        npcs: [],
        memoryContext: previous
          ? `CENA ${previous.sequence ?? '?'} — ${previous.title}\nAção: ${previous.playerText || 'abertura'}\nResumo: ${previous.summary || ''}\nTrecho final: ${String(previous.narration || '').slice(-700)}`
          : 'Nenhuma cena canônica anterior disponível.',
        worldContext: 'Contexto detalhado do mundo excedeu o orçamento desta ação. Preserve estritamente os fatos da cena atual e não invente mecânicas.',
        ruleContext: '',
        campaignNotesContext: '',
        ruleCitations: [],
        environmentContext: `Local atual: ${current.terrainResolution?.finalTerrainLabel || current.physicalTerrainLabel || current.terrain || 'terras selvagens'}.`,
        environmentCues: [],
      };
      setMessage('Contexto pesado ignorado; enviando a ação ao Mestre...');
      await yieldToUi();
    }"""
          if old_context not in s:
              raise SystemExit('MasterContextBuilder marker not found')
          s=s.replace(old_context,new_context,1)

          adventure.write_text(s,encoding='utf-8')

          gradle=root/'android/app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=g.replace('versionCode 303018','versionCode 303019')
          g=g.replace('versionName "3.3.18"','versionName "3.3.19"')
          gradle.write_text(g,encoding='utf-8')

          package=root/'package.json'
          data=json.loads(package.read_text(encoding='utf-8'))
          data['version']='3.3.19'
          package.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          verify=root/'scripts/verify-runtime-3319.mjs'
          verify.write_text(r"""import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const adventure = fs.readFileSync(new URL('../src/screens/AdventureScreenV3.tsx', import.meta.url), 'utf8');
          const gradle = fs.readFileSync(new URL('../android/app/build.gradle', import.meta.url), 'utf8');

          assert.match(adventure, /audioEngine\.stopNarration\(\);/);
          assert.match(adventure, /reason: 'new_action'/);
          assert.match(adventure, /MASTER_CONTEXT_HARD_DEADLINE_MS = 5_000/);
          assert.match(adventure, /MASTER_CONTEXT_TIMEOUT/);
          assert.match(adventure, /Contexto pesado ignorado; enviando a ação ao Mestre/);
          assert.doesNotMatch(adventure, /const analyzed = await TerrainAnalysisService\.analyzeHex\(destination\)/);
          assert.match(adventure, /NUNCA chame Gemini Vision\/análise visual na frente do toque/);
          assert.match(adventure, /setTerrain\(\{ hex: destination, action: text, initial: false \}\)/);
          assert.match(adventure, /setBusy\(false\);\n\s*await yieldToUi\(\);\n\s*return;/);
          assert.match(gradle, /versionCode 303019/);
          assert.match(gradle, /versionName "3\.3\.19"/);

          console.log('PASS runtime-3319: action click is non-blocking, stops narration, skips synchronous Vision and has safe context timeout.');
          """.replace(/^          /gm,''),encoding='utf-8')
          PY

          node work/scripts/verify-runtime-3319.mjs

      - name: Locate Android and web roots
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/gradlew" ] && [ -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ] && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              ANDROID_ROOT="$candidate"
              break
            fi
          done < <(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          test -n "$ANDROID_ROOT"
          WEB_ROOT="$(dirname "$ANDROID_ROOT")"
          test -f "$WEB_ROOT/package.json"
          chmod +x "$ANDROID_ROOT/gradlew"
          echo "android_root=$GITHUB_WORKSPACE/$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$GITHUB_WORKSPACE/$WEB_ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and gates
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run verify:runtime-3318
          npm run verify:rules
          node scripts/verify-runtime-3319.mjs

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q "Contexto pesado ignorado" android/app/src/main/assets/public/assets
          grep -R -q "Confirme o terreno do destino" android/app/src/main/assets/public/assets
          grep -R -q "new_action" android/app/src/main/assets/public/assets
          ! grep -R -q "const analyzed = await TerrainAnalysisService.analyzeHex(destination)" src/screens/AdventureScreenV3.tsx
          grep -q "versionCode 303019" android/app/build.gradle
          grep -q 'versionName "3.3.19"' android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and assemble APK
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_BUILD.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK and source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303019'" APK_BADGING.txt
          grep -q "versionName='3.3.19'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

          (cd work && zip -qr "$GITHUB_WORKSPACE/$SOURCE_OUT" . -x 'node_modules/*' 'android/.gradle/*' 'android/app/build/*')
          unzip -t "$SOURCE_OUT" > SOURCE_OUT_ZIP_TEST.txt
          sha256sum "$SOURCE_OUT" > "$SOURCE_OUT.sha256"

      - name: Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r "$APK_NAME"
            adb shell pm clear com.braseiro.forbiddenlands
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 10
            adb shell pidof com.braseiro.forbiddenlands
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            adb logcat -d -t 1200 > FORBIDDEN_LANDS_3.3.19_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.19_LOGCAT.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.19-action-freeze-hotfix
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk.sha256
            Braseiro_Forbidden_Lands_3.3.19_ACTION_FREEZE_HOTFIX_ANDROID_STUDIO.zip
            Braseiro_Forbidden_Lands_3.3.19_ACTION_FREEZE_HOTFIX_ANDROID_STUDIO.zip.sha256
            APK_BADGING.txt
            APK_SIGNATURE.txt
            APK_ZIP_TEST.txt
            SOURCE_OUT_ZIP_TEST.txt
            GRADLE_BUILD.txt
            FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            FORBIDDEN_LANDS_3.3.19_LOGCAT.txt

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="forbidden-lands-3.3.19-action-freeze-hotfix"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             "$APK_NAME"             "$APK_NAME.sha256"             "$SOURCE_OUT"             "$SOURCE_OUT.sha256"             --title "Forbidden Lands 3.3.19 — Action Freeze Hotfix"             --notes "Hotfix: para TTS ao tocar nova ação; remove Gemini Vision bloqueante do clique de viagem; limita montagem pesada de contexto a 5 s com fallback conservador sem regras inventadas."
