name: Forbidden Lands 3.3.19 Action TTS Isolation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-3319.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: "187d87cb9d0ec722eb4e1ce237ea0d2c8791fddb48673c25bc8b62c9c6989b73"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.19_ACTION_TTS_ISOLATION_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "MCKwS9BK3M1l"
  FILE_ID: "01a0d25b4c9d73d18baed089e85c0429"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.19 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.19 source not found')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" > SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$SOURCE_NAME" -d work

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and regression gates
        shell: bash
        working-directory: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run verify:runtime-3319
          npm run verify:rules

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -q "versionCode 303019" android/app/build.gradle
          grep -q 'versionName "3.3.19"' android/app/build.gradle
          grep -q "ttsControlExecutor.execute" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -q "activeSequenceIndex == 0 ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD" android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          grep -R -q "player input must always win over narration" src/screens/AdventureScreenV3.tsx
          grep -R -q "Action completion is committed/rendered before any native TTS work" src/screens/AdventureScreenV3.tsx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and assemble
        shell: bash
        working-directory: ${{ github.workspace }}/work/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest :app:processDebugResources :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_BUILD.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303019'" APK_BADGING.txt
          grep -q "versionName='3.3.19'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r "$APK_NAME"
            adb shell pm clear com.braseiro.forbiddenlands
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 10
            adb shell pidof com.braseiro.forbiddenlands
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            adb logcat -d -t 1200 > FORBIDDEN_LANDS_3.3.19_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.19_LOGCAT.txt

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3.3.19-action-tts-isolation
          compression-level: 0
          retention-days: 7
          path: |
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk
            BRASEIRO_FORBIDDEN_LANDS_3.3.19.apk.sha256
            APK_BADGING.txt
            APK_SIGNATURE.txt
            APK_ZIP_TEST.txt
            GRADLE_BUILD.txt
            FORBIDDEN_LANDS_3.3.19_FIRST_LAUNCH.png
            FORBIDDEN_LANDS_3.3.19_LOGCAT.txt
            SOURCE_ZIP_INTEGRITY.txt

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="forbidden-lands-3.3.19-action-tts-isolation"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             "$APK_NAME"             "$APK_NAME.sha256"             --title "Forbidden Lands 3.3.19 — Action / TTS Isolation"             --notes "Corrige congelamento ao tocar ações: ação cancela narração antes de RAG/Gemini; stop do Android TTS sai do caminho crítico da WebView; primeiro bloco local usa FLUSH uma vez e os seguintes QUEUE_ADD; autoplay só começa após cena persistida/renderizada."
