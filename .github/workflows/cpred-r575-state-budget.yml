name: Cyberpunk RED R5.75 mobile navigation and Android build
on:
  push:
    branches: [fix/cyberpunk-r575-state-budget]
    paths: [cyberpunk-red/r575/**, cyberpunk-red/mobile-r573/tests/**, .github/workflows/cpred-r575-state-budget.yml]
  workflow_dispatch:
concurrency:
  group: cpred-r575-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Retire superseded preliminary artifact until updated gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=cyberpunk-red-r575-state-budget-20261025
          OLD=$(gh api "repos/bra83/hello-world/releases/tags/$TAG" --jq '.assets[] | select(.name=="BRASEIRO_CYBERPUNK_RED_4.1.75.apk") | .digest' 2>/dev/null || true)
          if [ "$OLD" = 'sha256:4ee114f403bfc4de3b8233c831da0725552029fcb8fdf22146ae95dda7be1e46' ]; then
            gh release delete "$TAG" --repo bra83/hello-world --cleanup-tag --yes
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact reviewed Android source
        run: |
          curl --fail --location --retry 3 -o base.zip https://github.com/bra83/hello-world/releases/download/cyberpunk-red-r574-character-layout-20261025/CYBERPUNK_RED_4.1.74_ANDROID_SOURCE.zip
          echo 'ed35206f0169190ac887c11455ecd8cf0990d79066b113b91500929f5903d563  base.zip' | sha256sum --check
          python -c "import zipfile; zipfile.ZipFile('base.zip').extractall('build-source')"
          cp build-source/android/app/wheels/motor_barbara-1.1.2-py3-none-any.whl /tmp/cpred575-baseline.whl
          python cyberpunk-red/r575/apply.py build-source/android
          rm -f build-source/android/local.properties
      - name: Rules regression
        run: node --test cyberpunk-red/adventure-engine/tests/*.test.mjs
      - name: Reproduce old limit and verify lossless SQLite migration
        run: |
          python cyberpunk-red/r575/tests/state_budget.py /tmp/cpred575-baseline.whl old | tee state-baseline.log
          python cyberpunk-red/r575/tests/state_budget.py build-source/android/app/wheels/motor_barbara-1.1.2-py3-none-any.whl patched | tee state-budget.log
          node cyberpunk-red/r575/tests/start_failure.mjs "$PWD/build-source/android" | tee start-failure.log
      - name: Install browser for real click tests
        run: |
          npm install --prefix /tmp/cpred-browser --no-save playwright@1.51.1
          node /tmp/cpred-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise mobile navigation and asynchronous transport
        env:
          NODE_PATH: /tmp/cpred-browser/node_modules
          CPRED_TEST_URL: http://127.0.0.1:8091/build-source/android/app/src/main/assets/web/app/
          CPRED_TEST_OUTPUT: ${{ github.workspace }}/evidence/browser
        run: |
          python -m http.server 8091 --bind 127.0.0.1 > /tmp/cpred-http.log 2>&1 &
          CPRED_HTTP_PID=$!
          trap 'kill "$CPRED_HTTP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl --silent --fail http://127.0.0.1:8091/ >/dev/null && break; sleep 0.2; done
          curl --silent --fail http://127.0.0.1:8091/ >/dev/null
          node cyberpunk-red/mobile-r573/tests/navigation.cjs | tee navigation.log
          node cyberpunk-red/mobile-r573/tests/characters.cjs | tee characters.log
          python cyberpunk-red/mobile-r573/tests/narrative_repair.py build-source/android/app/wheels/motor_barbara-1.1.2-py3-none-any.whl | tee narrative.log
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fingerprint compiled sources
        id: fingerprint
        run: echo "sha=$(cat cyberpunk-red/r575/apply.py cyberpunk-red/r575/python/state_budget.py | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apkcache
        with:
          path: |
            build-source/android/app/build/outputs/apk/debug/app-debug.apk
            android-build.log
          key: cpred-r575-apk-${{ steps.fingerprint.outputs.sha }}
      - name: Compile Android APK
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: build-source/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ../../android-build.log
      - uses: actions/cache/save@v4
        if: steps.apkcache.outputs.cache-hit != 'true'
        with:
          path: |
            build-source/android/app/build/outputs/apk/debug/app-debug.apk
            android-build.log
          key: cpred-r575-apk-${{ steps.fingerprint.outputs.sha }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Touch navigation in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python cyberpunk-red/r575/tests/android_navigation.py build-source/android/app/build/outputs/apk/debug/app-debug.apk evidence/android
      - name: Publish diagnostic evidence on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          zip -qr failure-evidence.zip evidence
          TAG=cyberpunk-red-r575-diagnostics-20261025
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'Cyberpunk 4.1.75 diagnostic evidence' --notes 'Automated screenshots and logs for debugging, no APK.'
          gh release upload "$TAG" failure-evidence.zip --clobber
      - name: Package source and APK
        run: |
          mkdir -p deliverables
          cp build-source/android/app/build/outputs/apk/debug/app-debug.apk deliverables/BRASEIRO_CYBERPUNK_RED_4.1.75.apk
          rm -f build-source/android/local.properties
          cd build-source
          zip -qr ../deliverables/CYBERPUNK_RED_4.1.75_ANDROID_SOURCE.zip android -x '*/build/*' '*/.gradle/*' '*/.kotlin/*'
          cd ..
          cp navigation.log android-build.log characters.log narrative.log state-baseline.log state-budget.log start-failure.log deliverables/
          cp -r evidence deliverables/
          cd deliverables
          zip -qr CYBERPUNK_RED_4.1.75_EVIDENCIAS.zip evidence
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=cyberpunk-red-r575-state-budget-20261025
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'Cyberpunk RED 4.1.75 — persistência e recuperação do estado' --notes 'Corrige state_too_large com arquivamento auditável e compactação de histórico sem apagar saves, e restaura o estado após falha no início da aventura. Preserva gestão de personagens, JSON nativo, barra inferior, textos cortados, assets e compatibilidade OTA. Corrige o ciclo infinito do observador de interface, usa comunicação Android assíncrona e reorganiza as telas com base no Star Wars. Inclui testes de cliques no navegador e no Android WebView. Validação no aparelho físico continua necessária.'
          gh release upload "$TAG" deliverables/*.apk deliverables/*.zip deliverables/*.txt deliverables/*.log --clobber
