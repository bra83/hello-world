name: Inspect Forbidden Lands 3.3.18 Action Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA256: "3548652a60d4d3c7e11eef072028cbdbdf244531be1487d689f1d36ba9dba4c3"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.18_KOKORO_STREAMING_PROFILE_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "074j3IuXdyPA"
  FILE_ID: "01a0ce2b83897377a093fb98687637a3"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/files.json
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/download.json
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json')).get('downloadUrl') or '')
          PY
          )"
          test -n "$URL"
          curl -fL "$URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Inspect action/TTS flow
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== ROOTS ==="
            find work -maxdepth 3 -name package.json -o -name AndroidManifest.xml | sort

            echo
            echo "=== PREDEFINED ACTION TEXT MATCHES ==="
            grep -RIn --exclude-dir=node_modules --exclude='*.map' -E               'ação pré|acoes pre|ações pre|predefined|pre-defined|quick action|actionPreset|presetAction|suggested action|ações suger|agir|explorar|observar|investigar|atacar|falar'               work | head -n 800 || true

            echo
            echo "=== CLICK/HANDLER + BUSY/LOCK ==="
            grep -RIn --exclude-dir=node_modules --exclude='*.map' -E               'onClick|handle.*Action|submit.*Action|send.*Action|perform.*Action|isBusy|busy|loading|processing|pending|locked|mutex|inFlight|actionInProgress|disabled'               work | head -n 1200 || true

            echo
            echo "=== TTS CALL SITES ==="
            grep -RIn --exclude-dir=node_modules --exclude='*.map' -E               'speakSequence|speakBufferedSequence|NativeAndroidTts|AndroidTts|speak\(|narrat|TTS|tts'               work | head -n 1400 || true

            echo
            echo "=== PROMISE/AWAIT AROUND ACTIONS ==="
            grep -RIn --exclude-dir=node_modules --exclude='*.map' -E               'await .*speak|await .*tts|await .*narrat|await .*generate|await .*Gemini|await .*action|finally|try \{|catch \('               work | head -n 1600 || true
          } | tee out/ACTION_TTS_GREP.txt

          # Copy likely JS/TS sources with action + TTS references.
          python3 - <<'PY'
          import os,re,shutil
          root='work'
          out='out/relevant'
          os.makedirs(out,exist_ok=True)
          pats=[re.compile(x,re.I) for x in [
            r'predefined|presetAction|suggested action|ação pré|acoes pre|ações pre',
            r'speakSequence|NativeAndroidTts|AndroidTts|\btts\b',
            r'handle.*action|submit.*action|send.*action|perform.*action',
          ]]
          copied=[]
          for base,dirs,files in os.walk(root):
            dirs[:] = [d for d in dirs if d not in ('node_modules','.git','build')]
            for fn in files:
              if not fn.endswith(('.js','.jsx','.ts','.tsx','.java','.kt','.html','.json')): continue
              p=os.path.join(base,fn)
              try:
                s=open(p,encoding='utf-8',errors='ignore').read()
              except: continue
              if any(pat.search(s) for pat in pats):
                rel=os.path.relpath(p,root)
                dest=os.path.join(out,rel)
                os.makedirs(os.path.dirname(dest),exist_ok=True)
                shutil.copy2(p,dest)
                copied.append(rel)
          open('out/RELEVANT_FILES.txt','w').write('\n'.join(copied))
          print('\n'.join(copied[:500]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: forbidden-lands-3318-action-freeze-inspection
          retention-days: 7
          path: out
