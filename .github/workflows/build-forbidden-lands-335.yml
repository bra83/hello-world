name: Forbidden Lands 3.3.5 Start Button Hotfix
# smoke-fixed-tap: 2026-09-20

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-forbidden-lands-335.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: "6a1ba9650e47809cd8676b90ab8dcc58ee9fdc99ba9e3398f118d97e5340d27f"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.5_START_LOCAL_CHOICES_TTS_HOTFIX_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "wmCoQh-1bWf6"
  FILE_ID: "01a0bdd008c677d69bfec4e730d4474c"
  RELEASE_TAG: "forbidden-lands-3.3.5-start-hotfix"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5.apk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download exact 3.3.5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.5 source not found')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" > SOURCE_ZIP_INTEGRITY.txt
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Locate Android and web roots
        id: src
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/gradlew" ]               && [ -f "$candidate/gradle/wrapper/gradle-wrapper.jar" ]               && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              ANDROID_ROOT="$candidate"
              break
            fi
          done < <(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          test -n "$ANDROID_ROOT"
          WEB_ROOT="$(dirname "$ANDROID_ROOT")"
          test -f "$WEB_ROOT/package.json"
          chmod +x "$ANDROID_ROOT/gradlew"
          echo "android_root=$GITHUB_WORKSPACE/$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$GITHUB_WORKSPACE/$WEB_ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and runtime gates
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund
          npm run verify:runtime-335
          npm run verify:rules

      - name: Build web and sync Android
        shell: bash
        working-directory: ${{ steps.src.outputs.web_root }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q "Ação Livre" android/app/src/main/assets/public/assets
          grep -R -q "Escolhas sugeridas" android/app/src/main/assets/public/assets
          grep -q "3.3.5: INICIAR é 100% local" src/screens/AdventureScreenV3.tsx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper and projects
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew --version --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_VERSION.txt"
          ./gradlew projects --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_PROJECTS.txt"

      - name: Gradle resources
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_RESOURCES.txt"

      - name: Gradle compile
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_COMPILE.txt"

      - name: Assemble APK
        shell: bash
        working-directory: ${{ steps.src.outputs.android_root }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon | tee "$GITHUB_WORKSPACE/GRADLE_ASSEMBLE.txt"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$APK_NAME" > APK_ZIP_TEST.txt
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK_NAME" | tee APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" APK_BADGING.txt
          grep -q "versionCode='303005'" APK_BADGING.txt
          grep -q "versionName='3.3.5'" APK_BADGING.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android smoke including Start button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1440x3088
            adb shell wm density 560
            adb install -r "$APK_NAME"
            adb shell am start -W -n com.braseiro.forbiddenlands/.MainActivity
            sleep 6
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.5_BEFORE_START.png
            adb shell uiautomator dump /sdcard/fl_before.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/fl_before.xml > FORBIDDEN_LANDS_3.3.5_BEFORE_UI.xml 2>/dev/null || true

            adb shell input tap 720 2290
            sleep 8

            adb shell pidof com.braseiro.forbiddenlands
            adb exec-out screencap -p > FORBIDDEN_LANDS_3.3.5_AFTER_START.png
            adb shell uiautomator dump /sdcard/fl_after.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/fl_after.xml > FORBIDDEN_LANDS_3.3.5_AFTER_UI.xml 2>/dev/null || true
            adb logcat -d -t 1000 > FORBIDDEN_LANDS_3.3.5_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" FORBIDDEN_LANDS_3.3.5_LOGCAT.txt

      - name: Publish worker release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG"             --target "$GITHUB_SHA"             --title "Forbidden Lands 3.3.5 — Start Button Hotfix"             --notes "Start button is now 100% local before any Gemini call. The first playable scene is committed immediately with three predefined choices plus Ação Livre. Gemini begins only after the player's first action. Gemini TTS gets one short attempt, then Android TTS continues."

          gh release upload "$RELEASE_TAG"             "$APK_NAME" "$APK_NAME.sha256"             APK_ZIP_TEST.txt APK_BADGING.txt APK_SIGNATURE.txt             GRADLE_VERSION.txt GRADLE_PROJECTS.txt GRADLE_RESOURCES.txt GRADLE_COMPILE.txt GRADLE_ASSEMBLE.txt             FORBIDDEN_LANDS_3.3.5_BEFORE_START.png FORBIDDEN_LANDS_3.3.5_AFTER_START.png             FORBIDDEN_LANDS_3.3.5_BEFORE_UI.xml FORBIDDEN_LANDS_3.3.5_AFTER_UI.xml             FORBIDDEN_LANDS_3.3.5_LOGCAT.txt SOURCE_ZIP_INTEGRITY.txt
