name: Cyberpunk RED R5.63 handoff export

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cpred-r549-fix.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download verified R5.63 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh run download 35555964569 -n cyberpunk-red-r5.63-concept-pixelmatch -D out
          ls -lh out
          test -f out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip
          test -f out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.sha256
          test -f out/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk
          test -f out/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk.sha256
          echo "=== CHECKPOINT SHA ==="
          cat out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.sha256
          echo "=== APK SHA ==="
          cat out/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk.sha256

      - name: Split checkpoint for durable Drive backup
        shell: bash
        run: |
          set -euo pipefail
          cd out
          split -b 80000000 -d -a 2 CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part
          sha256sum CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part* > R5_63_PART_SHA256S.txt
          cat R5_63_PART_SHA256S.txt
          ls -lh CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part*

      - uses: actions/upload-artifact@v4
        with:
          name: cpred-r563-part00
          path: out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part00
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: cpred-r563-part01
          path: out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part01
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: cpred-r563-part02
          path: out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part02
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: cpred-r563-part03
          path: out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.part03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: cpred-r563-hashes
          path: |
            out/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.sha256
            out/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk.sha256
            out/R5_63_PART_SHA256S.txt
          retention-days: 90
