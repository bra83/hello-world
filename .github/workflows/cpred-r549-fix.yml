name: Cyberpunk RED R5.63 interface rebuild

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cpred-r549-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_URL: "https://github.com/bra83/hello-world/releases/download/cyberpunk-red-r5.49-real-device-fix/CYBERPUNK_RED_R5_49_REAL_DEVICE_FIX_CHECKPOINT.zip"
  BASE_SHA256: "a47e6c46ac3683d85eacda58f083aef308ddcb737ceb28fd39b42f579ee1577a"
  OVERLAY_URL: "https://firestorage.ai/ja/f/Yx8ADeReKrUF"
  OVERLAY_SHA256: "9c331093898cd0ef20fadcb2f34552794e891fd5c5b2d9e7aa456f2185ed094e"
  RELEASE_TAG: "cyberpunk-red-r5.63-concept-pixelmatch"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download verified R5.49 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl -fL --retry 4 --retry-delay 2 -o incoming/base.zip "$BASE_URL"
          echo "$BASE_SHA256  incoming/base.zip" | sha256sum -c -
          unzip -t incoming/base.zip >/dev/null

      - name: Download exact R5.63 UI overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r560
          cd /tmp/r560
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > one.mjs <<'NODE'
          import { chromium } from 'playwright';
          const [url,out]=process.argv.slice(2);
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({acceptDownloads:true,locale:'ja-JP'});
          const p=await c.newPage();
          async function open(){await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1600)}
          await open();
          for(let round=0;round<14;round++){
            const es=p.locator('a,button,[role="button"]');
            for(let i=0;i<Math.min(await es.count(),220);i++){
              const e=es.nth(i);let meta='';
              try{meta=(await e.innerText())+' '+(await e.getAttribute('title')||'')+' '+(await e.getAttribute('aria-label')||'')+' '+(await e.getAttribute('href')||'')}catch{}
              if(!/download|ダウンロード|保存|取得|zip|file|ファイル/i.test(meta))continue;
              try{
                const q=p.waitForEvent('download',{timeout:9000});
                await e.click({timeout:4500});
                const d=await q;
                await d.saveAs(out);
                console.log('OVERLAY_OK',await d.suggestedFilename());
                await b.close();
                process.exit(0);
              }catch{}
            }
            await p.waitForTimeout(1400);
            if(round%4===3)await open();
          }
          console.error((await p.locator('body').innerText()).slice(0,5000));
          await b.close();process.exit(2);
          NODE
          node one.mjs "$OVERLAY_URL" "$GITHUB_WORKSPACE/incoming/overlay.zip"
          cd "$GITHUB_WORKSPACE"
          test -s incoming/overlay.zip
          echo "$OVERLAY_SHA256  incoming/overlay.zip" | sha256sum -c -
          unzip -t incoming/overlay.zip >/dev/null

      - name: Assemble R5.63 source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q incoming/base.zip -d work
          PROJECT="$(find work -mindepth 1 -maxdepth 1 -type d | head -1)"
          ROOT="$PROJECT/android"
          test -f "$ROOT/settings.gradle.kts"
          unzip -oq incoming/overlay.zip -d "$ROOT"
          chmod +x "$ROOT/gradlew"
          grep -F 'versionCode = 4163' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "4.1.63"' "$ROOT/app/build.gradle.kts"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Interface architecture gates
        shell: bash
        env:
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          APP="$ROOT/app/src/main/assets/web/app"

          for f in app.js sheets.js gameplay.js netrun.js atlas.js audio.js; do
            echo "ES_MODULE_CHECK $f"
            node --input-type=module --check < "$APP/$f"
          done

          python3 - "$ROOT" <<'PY'
          import json,pathlib,sys,hashlib,re,zipfile
          root=pathlib.Path(sys.argv[1]); app=root/'app/src/main/assets/web/app'
          html=(app/'index.html').read_text(encoding='utf-8')
          css=(app/'interface_v2.css').read_text(encoding='utf-8')
          sheets=(app/'sheets.js').read_text(encoding='utf-8')
          appjs=(app/'app.js').read_text(encoding='utf-8')

          # Required persistent shell.
          for text in ['SESSÃO','MUNDO','MAPA','FICHA','MAIS','MUNDO VIVO','NPCs PRESENTES','AÇÃO LIVRE','BIBLIOTECA','STREET STORIES','VEÍCULO']:
              assert text in html,text
          for id_ in ['sessionWorldTime','sceneNpcList','sceneIllustration','tableNarrative','sessionRecommended','sessionActionInput','sessionActionSend','sessionListenBtn','sessionAndroidListenBtn','sessionLibraryBtn','npcVisualSheet','moreSheet']:
              assert f'id="{id_}"' in html,id_
          assert 'bottom-nav' in html
          assert 'interface_v2.css' in html
          assert 'app.js?build=4163' in html
          assert 'data-tab="stories"' in html and 'id="tab-stories"' in html
          assert 'data-tab="vehicle"' in html and 'id="tab-vehicle"' in html
          assert 'sceneNpcKey(n)' in sheets and 'npcVisualRegistry' in sheets and 'importNpcVisual' in sheets
          assert "listenNarration('android')" in sheets
          assert "['table','game','stories','vehicle','combat','library']" in appjs
          assert "$('#tableDiceBtn')?.addEventListener" in appjs
          assert "background-image:none!important" in css
          assert "position:fixed!important" in css and "bottom-nav" in css

          # JSON + asset integrity.
          for p in root.rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          data=app/'data'
          core=json.loads((data/'equipment_catalog.json').read_text(encoding='utf-8'))
          assert len(core['items'])==123
          hashes=set()
          for x in core['items']:
              q=app/x['asset']; assert q.is_file() and q.stat().st_size>500,(x.get('id'),x.get('asset'))
              h=hashlib.sha256(q.read_bytes()).hexdigest();assert h not in hashes,x.get('id');hashes.add(h)
          specs=[
            ('equipment_catalog.json','items',lambda x:x.get('category')=='weapon',16),
            ('black_chrome_catalog.json','items',lambda x:x.get('category')=='weapon',55),
            ('interface_red_vol5_toggle_temple.json','items',lambda x:x.get('category')=='weapon',72),
            ('interface_red_vol2_mechanics.json','gunmasWeapons',lambda x:True,12),
          ]
          total=0
          for fn,key,pred,n in specs:
              obj=json.loads((data/fn).read_text(encoding='utf-8'));rows=[x for x in obj[key] if pred(x)]
              assert len(rows)==n,(fn,len(rows),n);total+=len(rows)
              for x in rows: assert (app/x['asset']).is_file(),(fn,x.get('name'),x.get('asset'))
          assert total==155
          print('R5_63_UI_GATE_PASS core_items=123 weapons=155 unique_core_assets=123')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile R5.63
        working-directory: ${{ steps.src.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --no-daemon --stacktrace
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | sort | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk"
          unzip -t "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk" >/dev/null
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk" | tee "$GITHUB_WORKSPACE/APK_BADGING_R563.txt"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk" | tee "$GITHUB_WORKSPACE/APK_SIGNATURE_R563.txt"
          grep -q "package: name='com.braseiro.cyberpunkred' versionCode='4163' versionName='4.1.63'" "$GITHUB_WORKSPACE/APK_BADGING_R563.txt"
          sha256sum "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk" > "$GITHUB_WORKSPACE/BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk.sha256"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android layout and navigation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1440x3088
            adb shell wm density 560
            adb install -r BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk
            adb shell am force-stop com.braseiro.cyberpunkred
            adb shell am start -W -n com.braseiro.cyberpunkred/.MainActivity
            sleep 18
            adb shell pidof com.braseiro.cyberpunkred

            adb shell uiautomator dump /sdcard/session.xml >/dev/null || true
            adb pull /sdcard/session.xml R5_63_SESSION_UI.xml >/dev/null || true
            test ! -f R5_63_SESSION_UI.xml || ! grep -q "INTERFACE NÃO INICIALIZOU" R5_63_SESSION_UI.xml
            test ! -f R5_63_SESSION_UI.xml || ! grep -q "Invalid or unexpected token" R5_63_SESSION_UI.xml
            adb exec-out screencap -p > R5_63_SESSION_ANDROID.png

            # Mundo
            adb shell input tap 430 2940
            sleep 5
            adb exec-out screencap -p > R5_63_WORLD_ANDROID.png

            # Mapa
            adb shell input tap 720 2940
            sleep 6
            adb exec-out screencap -p > R5_63_MAP_ANDROID.png

            # Ficha
            adb shell input tap 1010 2940
            sleep 5
            adb exec-out screencap -p > R5_63_SHEET_ANDROID.png

            # Mais
            adb shell input tap 1295 2940
            sleep 4
            adb exec-out screencap -p > R5_63_MORE_ANDROID.png

            for f in R5_63_SESSION_ANDROID.png R5_63_WORLD_ANDROID.png R5_63_MAP_ANDROID.png R5_63_SHEET_ANDROID.png R5_63_MORE_ANDROID.png; do test -s "$f"; done

            adb logcat -d -t 1500 > R5_63_LOGCAT.txt
            ! grep -q "Invalid or unexpected token" R5_63_LOGCAT.txt
            ! grep -q "\[CPRED_BOOT\]" R5_63_LOGCAT.txt
            ! grep -q "FATAL EXCEPTION" R5_63_LOGCAT.txt

      - name: Build visual overlay and diff review
        shell: bash
        env:
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - "$ROOT" <<'PY'
          from PIL import Image,ImageChops,ImageDraw,ImageFont,ImageStat
          import pathlib,sys,math
          root=pathlib.Path(sys.argv[1])
          refs=root/'visual_reference'
          pairs=[
            ('SESSÃO',refs/'home.png',pathlib.Path('R5_63_SESSION_ANDROID.png')),
            ('FICHA',refs/'sheet.png',pathlib.Path('R5_63_SHEET_ANDROID.png')),
            ('MAPA',refs/'map.png',pathlib.Path('R5_63_MAP_ANDROID.png')),
            ('MAIS',refs/'menu.png',pathlib.Path('R5_63_MORE_ANDROID.png')),
          ]
          rows=[]
          metrics=[]
          for label,refp,actp in pairs:
              ref=Image.open(refp).convert('RGB')
              act=Image.open(actp).convert('RGB').resize(ref.size,Image.Resampling.LANCZOS)
              # Target and actual are not expected to have identical content; this is a visual-review diff.
              diff=ImageChops.difference(ref,act)
              stat=ImageStat.Stat(diff)
              rmse=math.sqrt(sum(v*v for v in stat.rms)/3)
              metrics.append((label,rmse))
              row=Image.new('RGB',(ref.width*3,ref.height+30),(2,7,10))
              row.paste(ref,(0,30));row.paste(act,(ref.width,30));row.paste(diff,(ref.width*2,30))
              d=ImageDraw.Draw(row)
              d.text((6,8),f'{label}  TARGET',fill=(255,40,65))
              d.text((ref.width+6,8),'ANDROID ACTUAL',fill=(0,217,255))
              d.text((ref.width*2+6,8),f'DIFF  RMSE {rmse:.1f}',fill=(230,235,238))
              rows.append(row)
          canvas=Image.new('RGB',(max(r.width for r in rows),sum(r.height for r in rows)),(2,7,10))
          y=0
          for r in rows:
              canvas.paste(r,(0,y));y+=r.height
          canvas.save('R5_63_VISUAL_REVIEW_TARGET_ACTUAL_DIFF.png')
          pathlib.Path('R5_63_VISUAL_METRICS.txt').write_text('\n'.join(f'{k}_RMSE={v:.3f}' for k,v in metrics)+'\n',encoding='utf-8')

          # Explicit anti-regression gate: hot-pink filled-button language must not dominate the new UI.
          actual=Image.open('R5_63_SESSION_ANDROID.png').convert('RGB')
          pix=list(actual.resize((360,772),Image.Resampling.BILINEAR).getdata())
          hot=sum(1 for r,g,b in pix if r>190 and b>105 and g<125)
          ratio=hot/max(1,len(pix))
          pathlib.Path('R5_63_PALETTE_GATE.txt').write_text(f'hot_pink_ratio={ratio:.6f}\nthreshold=0.020000\n',encoding='utf-8')
          print('VISUAL_REVIEW_READY',metrics,'hot_pink_ratio',ratio)
          PY

      - name: Upload R5.63 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunk-red-r5.63-visual-review
          path: |
            R5_63_SESSION_ANDROID.png
            R5_63_WORLD_ANDROID.png
            R5_63_MAP_ANDROID.png
            R5_63_SHEET_ANDROID.png
            R5_63_MORE_ANDROID.png
            R5_63_VISUAL_REVIEW_TARGET_ACTUAL_DIFF.png
            R5_63_VISUAL_METRICS.txt
            R5_63_PALETTE_GATE.txt
            R5_63_LOGCAT.txt
            R5_63_SESSION_UI.xml
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Enforce concept visual gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('R5_63_PALETTE_GATE.txt')
          vals={}
          for line in p.read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); vals[k]=float(v)
          ratio=vals['hot_pink_ratio']; threshold=vals['threshold']
          print(f'VISUAL_GATE hot_pink_ratio={ratio:.6f} threshold={threshold:.6f}')
          if ratio>threshold:
              raise SystemExit(f'HOT_PINK_REGRESSION ratio={ratio:.4f}')
          PY

      - name: Package R5.63 checkpoint
        shell: bash
        env:
          PROJECT: ${{ steps.src.outputs.project }}
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/app/src/main/assets/web/app/preview_nojs.html"
          mkdir -p "$PROJECT/project_docs"
          cat > "$PROJECT/project_docs/HANDOFF_CYBERPUNK_RED_R5_63_CONCEPT_AUTHORITY.md" <<'EOF'
          # Cyberpunk RED R5.63 — Concept Pixelmatch
          Persistent bottom navigation: SESSÃO | MUNDO | MAPA | FICHA | MAIS.
          Session order: Mundo Vivo -> NPCs presentes -> imagem da cena -> Mestre -> estado contextual -> ações sugeridas -> ação livre -> imagem/TTS/Biblioteca.
          Mundo Vivo is a dedicated screen.
          Biblioteca remains a dedicated screen.
          Street Stories and Vehicle are standalone screens reachable from Mais.
          NPCs now have a persistent visual registry: generated/imported identity is tied to that NPC and reused.
          Scene images remain scene-bound.
          Player portrait/token remain character-bound.
          UI structure uses HTML/CSS; no decorative structural image layer was introduced.
          Core equipment assets remain 123/123 unique semantic assets.
          Runtime weapon asset coverage remains 155/155.
          Android version: 4.1.0 / 4100.
          EOF
          rm -rf "$ROOT/.gradle" "$ROOT/build" "$ROOT/app/build"
          OUT="$GITHUB_WORKSPACE/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip"
          PARENT="$(dirname "$PROJECT")";NAME="$(basename "$PROJECT")"
          (cd "$PARENT" && zip -qr "$OUT" "$NAME")
          unzip -t "$OUT" > "$GITHUB_WORKSPACE/R5_63_ZIP_INTEGRITY.txt"
          sha256sum "$OUT" > "$GITHUB_WORKSPACE/CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.sha256"
          sha256sum R5_63_SESSION_ANDROID.png R5_63_WORLD_ANDROID.png R5_63_MAP_ANDROID.png R5_63_SHEET_ANDROID.png R5_63_MORE_ANDROID.png > R5_63_SCREENSHOTS.sha256

      - name: Upload R5.63 verified artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunk-red-r5.63-concept-pixelmatch
          path: |
            BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk
            BRASEIRO-CYBERPUNK-RED-R5.63-DEBUG.apk.sha256
            APK_BADGING_R563.txt
            APK_SIGNATURE_R563.txt
            CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip
            CYBERPUNK_RED_R5_63_CONCEPT_PIXELMATCH_CHECKPOINT.zip.sha256
            R5_63_ZIP_INTEGRITY.txt
            R5_63_SESSION_ANDROID.png
            R5_63_WORLD_ANDROID.png
            R5_63_MAP_ANDROID.png
            R5_63_SHEET_ANDROID.png
            R5_63_MORE_ANDROID.png
            R5_63_SCREENSHOTS.sha256
            R5_63_LOGCAT.txt
            R5_63_VISUAL_REVIEW_TARGET_ACTUAL_DIFF.png
            R5_63_VISUAL_METRICS.txt
            R5_63_PALETTE_GATE.txt
            R5_63_SESSION_UI.xml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Release blocked pending visual approval
        shell: bash
        run: |
          echo "RELEASE_BLOCKED_BY_USER_VISUAL_GATE=1"
          echo "R5.63 is artifact-only. No GitHub Release until target/actual/diff is visually approved."
