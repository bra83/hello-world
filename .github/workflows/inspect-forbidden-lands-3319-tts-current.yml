name: Inspect Forbidden Lands 3.3.19 TTS Current

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/inspect-forbidden-lands-3319-tts-current.yml"

permissions:
  contents: read

env:
  SOURCE_SHA256: "441fd6e9c0f667bc78a69c5699c371163de52087fd796b0d7ffa3afd60b159b1"
  SOURCE_NAME: "Braseiro_Forbidden_Lands_3.3.19_ACTION_TTS_ISOLATION_ANDROID_STUDIO.zip"
  FIRE_API: "https://api.firestorage.ai/dev/file"
  SHARE_ID: "2sonjo9_IOEG"
  FILE_ID: "01a0d25ef27e77b1b77fb761c277ca45"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/files.json
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/download.json
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json')).get('downloadUrl') or '')
          PY
          )"
          curl -fL "$URL" -o "incoming/$SOURCE_NAME"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -q "incoming/$SOURCE_NAME" -d work

      - name: Print TTS implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "===== ANDROID PLUGIN ====="
          sed -n '1,1200p' work/android/app/src/main/java/com/braseiro/forbiddenlands/AndroidTtsPlugin.java
          echo "===== TTS CLIENT FILES ====="
          grep -RIl --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' -E 'NativeAndroidTts|AndroidTts|ttsEngine|ttsVoice|speakSequence|selectTtsVoice|Braseiro Kokoro|kokoro' work/src work/android/app/src/main 2>/dev/null | sort | head -80
          echo "===== MATCHES ====="
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' -E 'NativeAndroidTts|AndroidTts|ttsEngine|ttsVoice|speakSequence|selectTtsVoice|Braseiro Kokoro|kokoro|com\.braseiro\.kokoro|com\.k2fsa\.sherpa' work/src work/android/app/src/main 2>/dev/null | head -1600
